<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101722">
  <title>BULLDROP — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101722;
      --card: #1b2735;
      --card2: #223247;
      --line: #334256;
      --text: #f4f6fa;
      --muted: #a9b5c5;
      --pink: #ff4d9e;
      --purple: #9b68ff;
      --gold: #e4b85c;
      --r-common: #8794a8;
      --r-rare: #4da3ff;
      --r-epic: #9b68ff;
      --r-legendary: #e4b85c;
      --r-mythic: #ff4d9e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 14px 14px calc(110px + env(safe-area-inset-bottom));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }

    .muted { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .note { color: var(--muted); font-size: 12px; text-align: center; margin: 12px 0 4px; line-height: 1.4; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { justify-content: space-between; }
    .page-title { font-size: 22px; font-weight: 800; margin: 4px 2px 14px; }
    .sec { font-size: 16px; font-weight: 700; margin: 20px 2px 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }

    /* ---------- ust qism: balans chiplari ---------- */
    .chips { display: flex; gap: 8px; justify-content: flex-end; margin: 0 2px 12px; flex-wrap: wrap; }
    .chip {
      display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, .06); border: 1px solid var(--line); font-size: 13px; color: var(--muted);
    }
    .chip b { color: var(--text); }
    .chip.gold { border-color: rgba(228, 184, 92, .4); color: var(--gold); }
    .chip.gold b { color: var(--gold); }

    /* ---------- Home ---------- */
    .profile { display: flex; align-items: center; gap: 12px; margin: 2px 2px 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line); flex: none; }
    .avatar .emoji { font-size: 20px; font-weight: 700; }
    .hello { font-size: 13px; color: var(--muted); }
    .uname { font-size: 18px; font-weight: 800; }
    .hero {
      border-radius: 22px; padding: 20px 18px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      box-shadow: 0 10px 30px rgba(155, 104, 255, .28);
    }
    .hero h2 { font-size: 24px; font-weight: 900; letter-spacing: .5px; }
    .hero p { margin: 6px 0 16px; font-size: 14px; line-height: 1.4; opacity: .95; }
    .hero { position: relative; overflow: hidden; }
    .hero.has-img { min-height: 210px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg .media { width: 100%; height: 100%; border-radius: 0; }
    .hero-bg img, .hero-bg video { width: 100%; height: 100%; object-fit: cover; }
    .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 14, 22, .10), rgba(10, 14, 22, .78)); }
    .hero-content { position: relative; }
    .wheelcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; margin-top: 12px; }
    .wic { font-size: 30px; }
    /* ---- umumiy o‘yinlar ---- */
    .ggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .gcard { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px; text-align: left; }
    .gcard .gi { font-size: 30px; margin-bottom: 4px; }
    .gcard small { color: var(--muted); }
    .mbet.mbet3 { grid-template-columns: 1fr 52px 52px 60px; }
    /* ---- Minora ---- */
    .tgrid { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .trow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tcell { height: 58px; border-radius: 18px; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: #2a2c31; border: 2px solid transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); transition: transform .1s, background .15s; }
    .tcell.cur { background: #353840; border-color: rgba(255, 255, 255, .75); box-shadow: 0 0 16px rgba(255, 255, 255, .18); }
    .tcell.cur:active { transform: scale(.97); }
    .tcell.ok { background: linear-gradient(180deg, rgba(53, 224, 138, .35), rgba(18, 137, 74, .55)); border-color: rgba(53, 224, 138, .7); }
    .tcell.dim { opacity: .35; }
    .tcell.bad { background: linear-gradient(180deg, rgba(255, 90, 100, .35), rgba(200, 25, 45, .7)); border-color: rgba(255, 90, 100, .8); box-shadow: 0 0 20px rgba(255, 40, 60, .5); }
    .tcell.gbad { background: rgba(200, 25, 45, .3); opacity: .85; }
    .tcell.gok { background: rgba(60, 140, 255, .22); opacity: .85; }
    .tcell .big { font-size: 26px; }
    .tcell.flip { animation: mflip .38s cubic-bezier(.2, .9, .3, 1.2); }
    /* ---- Narvon ---- */
    .lboard { background: #171a21; border: 1px solid var(--line); border-radius: 24px; padding: 14px 10px 10px; margin-top: 14px; }
    .lrow { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 28px; }
    .lc { position: relative; }
    .lrow.next .lc { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .lrow.next .lc.sel .lp { background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .8); }
    .lc .mk.pickmk { color: #fff; font-size: 10px; line-height: 15px; bottom: 12px; animation: mflip .25s ease; }
    .lc .lp { position: absolute; left: 0; right: 0; bottom: 2px; height: 9px; border-radius: 6px; background: #272a32; }
    .lrow.done .lp { background: #444853; }
    .lrow.next .lp { background: #ff4d58; box-shadow: 0 0 8px rgba(255, 77, 88, .55); }
    .lc .mk { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); width: 15px; height: 15px; line-height: 15px; font-size: 13px; text-align: center; z-index: 1; }
    .lc .mk svg { width: 100%; height: 100%; display: block; }
    .lc .mk.flip { animation: mflip .35s cubic-bezier(.2, .9, .3, 1.2); }
    .trail { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .55); vertical-align: middle; }
    .lchips { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
    .lchips::-webkit-scrollbar { display: none; }
    .lchip2 { flex: none; padding: 10px 18px; border-radius: 14px; font-weight: 800; background: #25282f; }
    .lchip2.next { background: #2fc96f; color: #fff; }
    .lchip2.done { background: rgba(47, 201, 111, .2); color: #6fe4a2; }
    .lsetup { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-top: 12px; align-items: start; }
    .lsetup .mbet.mbet3 { grid-template-columns: 1fr 1fr 1fr; }
    .lsetup .mbet3 input { grid-column: 1 / -1; }
    .lmodes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lmode { height: 46px; border-radius: 14px; font-size: 18px; font-weight: 900; color: #fff; background: #2a2c31; }
    .lmode.sel { background: #e9ecf2; color: #111; }
    .lmode:disabled { opacity: .55; }
    /* ---- Saper ---- */
    .mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
    .mcell { aspect-ratio: 1 / 1; border-radius: 16px; padding: 8%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #3a3d44, #25272c); border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -10px 16px rgba(0, 0, 0, .25), 0 4px 10px rgba(0, 0, 0, .35);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .1s; }
    .mcell:active:not(:disabled) { transform: scale(.94); }
    .mcell svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
    .mcell.gem { background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 170, 40, .75)); border-color: rgba(255, 190, 80, .55); }
    .mcell.boom { background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(225, 29, 46, .8)); border-color: rgba(255, 90, 100, .7); box-shadow: 0 0 22px rgba(255, 40, 60, .55); }
    .mcell.ghostgem { background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 170, 40, .32)); opacity: .62; }
    .mcell.ghostmine { background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(225, 29, 46, .4)); opacity: .7; }
    .mcell.flip { animation: mflip .38s cubic-bezier(.2, .9, .3, 1.2); }
    @keyframes mflip { from { transform: scale(.55) rotateY(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .minfo { padding: 14px; }
    .minfo .iv { font-size: 20px; font-weight: 900; }
    .minfo .il { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .mmode { display: flex; align-items: center; justify-content: space-between; padding: 8px; }
    .mmode .mv { text-align: center; }
    .mmode .mvn { font-size: 24px; font-weight: 900; }
    .mmode small { color: var(--muted); font-size: 12px; }
    .marrow { width: 36px; height: 44px; font-size: 26px; font-weight: 900; color: #fff; border-radius: 12px; background: rgba(255, 255, 255, .07); }
    .marrow:disabled { opacity: .3; }
    .mbet { display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; margin-top: 10px; align-items: center; }
    .mbet .btn { margin-top: 0; height: 100%; }
    .mnext { text-align: center; font-weight: 800; color: var(--gold); min-height: 22px; margin-top: 10px; }
    .mladder { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .mladder::-webkit-scrollbar { display: none; }
    .lchip { flex: none; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 13px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); text-align: center; }
    .lchip small { display: block; font-size: 10px; color: var(--muted); }
    .lchip.cur { background: rgba(255, 170, 40, .25); border-color: rgba(255, 190, 80, .8); }
    .lchip.done { opacity: .5; }
    /* ---- G‘ildirak ---- */
    .whead { display: flex; align-items: center; justify-content: space-between; }
    .wleft { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .gback { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .gback .ic { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.4; filter: none; }
    .gtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
    .gtile { display: flex; flex-direction: column; gap: 8px; text-align: left; background: none; padding: 0; transition: transform .15s; }
    .gtile:active { transform: scale(.96); }
    .gtile .gimg { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 26px; border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 10px 24px rgba(0, 0, 0, .35); background: #1b1d20; }
    .gtile b { font-size: 16px; padding: 0 4px; }
    .gtile small { color: var(--muted); padding: 0 4px; margin-top: -6px; }
    .whead .wt { margin: 0; }
    .wsnd { width: 40px; height: 40px; border-radius: 14px; font-size: 18px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .wstage { position: relative; height: 290px; margin: 12px -16px 0; overflow: hidden; border-radius: 26px; background: linear-gradient(180deg, #232832, #0c0f14 70%); border: 1px solid rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
    .wring { position: absolute; left: 50%; width: 1360px; height: 1360px; margin-left: -680px; top: -1050px; border-radius: 50%; will-change: transform;
      background: radial-gradient(circle, #090b0f 0 56%, #3b414d 56.4%, #15181e 58%, #0e1014 70%); }
    .wtile { position: absolute; left: calc(50% - 37px); top: calc(50% - 50px); width: 74px; height: 100px; border-radius: 16px; text-align: center; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform-origin: 37px 50px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -14px 20px rgba(0, 0, 0, .25), 0 6px 14px rgba(0, 0, 0, .45); }
    .wtile .wti { font-size: 34px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45)); }
    .wtile .wtl { font-size: 15px; font-weight: 900; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
    .k-x1 { background: linear-gradient(160deg, #4d9bff, #1b4fb8); }
    .k-x2 { background: linear-gradient(160deg, #36d983, #12894a); }
    .k-x5 { background: linear-gradient(160deg, #ff5d73, #a8132b); }
    .k-x10 { background: linear-gradient(160deg, #bd7bff, #6428cc); }
    .wtile.locked { filter: grayscale(1) brightness(.45); }
    .wtile.hit { box-shadow: 0 0 0 2px #fff, 0 0 26px 4px rgba(255, 255, 255, .55), inset 0 1px 0 rgba(255, 255, 255, .5); z-index: 2; }
    .wshade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(8, 10, 14, .85), transparent 22%, transparent 78%, rgba(8, 10, 14, .85)), linear-gradient(0deg, rgba(8, 10, 14, .9), transparent 28%); }
    .wdisp { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 210px; height: 70px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #14171c, #07090c); border: 1px solid #4a505c; box-shadow: inset 0 0 18px rgba(0, 0, 0, .8), 0 0 0 4px #20242b, 0 8px 20px rgba(0, 0, 0, .5); overflow: hidden; }
    .wdisp::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0, 0, 0, .55) 38%, transparent 42%); background-size: 5px 5px; pointer-events: none; }
    .wdisp .dl { font: 700 10px/1 monospace; letter-spacing: 3px; color: #7da2ff; opacity: .8; }
    .wdisp .db { font: 900 32px/1.1 monospace; letter-spacing: 5px; color: #eaf1ff; text-shadow: 0 0 10px rgba(130, 170, 255, .9); }
    .wdisp.spin .db { color: #ffd966; text-shadow: 0 0 12px rgba(255, 200, 80, .95); }
    .wpointer { position: absolute; top: 88px; left: 50%; width: 40px; height: 52px; transform: translateX(-50%); transform-origin: 50% 8%; z-index: 3; background: linear-gradient(180deg, #fff, #aeb6c4); clip-path: polygon(50% 100%, 0 20%, 14% 0, 86% 0, 100% 20%); filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
    .whist { display: flex; gap: 7px; align-items: center; margin-top: 12px; padding: 10px 12px; min-height: 44px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); overflow: hidden; }
    .hd { width: 22px; height: 22px; border-radius: 8px; flex: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
    .wchips { display: flex; justify-content: center; gap: 10px; margin: 12px 0; }
    .wchip { padding: 9px 16px; border-radius: 14px; font-weight: 800; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .wbanner { text-align: center; font-weight: 900; font-size: 18px; padding: 0; max-height: 0; overflow: hidden; border-radius: 16px; transition: max-height .25s, padding .25s; }
    .wbanner.show { max-height: 70px; padding: 12px; margin-bottom: 12px; }
    .wbanner.win { background: rgba(53, 224, 138, .16); color: #5cf0a5; border: 1px solid rgba(53, 224, 138, .4); }
    .wbanner.lose { background: rgba(255, 255, 255, .06); color: var(--muted); border: 1px solid var(--line); }
    .wpanel { padding: 14px; }
    .wlabel { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .wbetinput { text-align: left; font-weight: 800; }
    .wquick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .wquick .btn { margin-top: 0; }
    .wkinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .wk { position: relative; overflow: hidden; height: 92px; border-radius: 18px; text-align: left; padding: 12px 14px; color: #fff; border: 2px solid transparent; opacity: .72; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); transition: transform .12s, opacity .12s; }
    .wk.sel { opacity: 1; border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .15), 0 8px 20px rgba(0, 0, 0, .4); }
    .wk .kx { font-size: 28px; font-weight: 900; }
    .wk .ks { font-size: 12px; font-weight: 700; opacity: .9; margin-top: 2px; }
    .wk .ka { position: absolute; right: 8px; bottom: -4px; font-size: 52px; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .45)); }
    .wk.locked { filter: grayscale(1) brightness(.5); }
    .wk:active { transform: scale(.97); }
    .wrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; }
    .wrow .btn { margin-top: 0; }
    .wauto { min-width: 92px; }
    .wauto.on { background: linear-gradient(135deg, rgba(53, 224, 138, .7), rgba(18, 137, 74, .7)); }
    .up { color: #5cf0a5; }
    .down { color: var(--muted); }
    i.dot.k-x1, i.dot.k-x2, i.dot.k-x5, i.dot.k-x10 { }
    .bets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
    .chipbtn { padding: 9px 14px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
    .chipbtn.on { background: linear-gradient(135deg, var(--pink), var(--purple)); border: 0; color: #fff; }
    .betinput { width: 100%; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--text); font-size: 16px; text-align: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: var(--muted); }
    .kv b { text-align: right; word-break: break-word; }
    .banner { display: block; width: 100%; padding: 0; overflow: hidden; border-radius: 18px; margin-bottom: 12px; }
    .banner .media { aspect-ratio: 16 / 7; border-radius: 18px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .stat { padding: 12px 8px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
    .hscroll::-webkit-scrollbar { display: none; }

    /* ---------- tugmalar ---------- */
    .btn {
      position: relative; border-radius: 16px; padding: 12px 16px; font-weight: 800; color: #fff;
      background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05));
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -8px 14px rgba(255, 255, 255, .03), 0 6px 18px rgba(0, 0, 0, .28);
      -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn::after { content: ""; position: absolute; left: 12%; right: 12%; top: 2px; height: 42%; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent); pointer-events: none; }
    .btn.primary {
      background: linear-gradient(135deg, rgba(255, 79, 163, .78), rgba(143, 90, 255, .78));
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 24px rgba(214, 80, 220, .35);
    }
    .btn.white {
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .78)); color: #1b1030;
      border: 1px solid rgba(255, 255, 255, .8);
      box-shadow: inset 0 1px 0 #fff, 0 8px 22px rgba(0, 0, 0, .25);
    }
    .btn.white::after { display: none; }
    .btn:disabled { opacity: .5; }
    .btn.big { width: 100%; padding: 15px; font-size: 16px; }
    .btn.small { padding: 9px 10px; font-size: 13px; border-radius: 13px; width: 100%; margin-top: 8px; }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    /* ---------- media ---------- */
    .media { display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .media img, .media video { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ---------- kartalar ---------- */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    }
    .case:active { transform: scale(.97); }

    }

    .pill {
      display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800;

      padding: 14px 10px 10px; border-radius: 16px;

        radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--c) 46%, transparent), transparent 75%),
        linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, #0e121a), color-mix(in srgb, var(--c) 8%, #0e121a));
      border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
    }
    .gift::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 34%; height: 5px; border-radius: 0 0 8px 8px; background: var(--c);
      box-shadow: 0 2px 14px var(--c);
    }
    .gift.small { width: 124px; flex: none; }
    .gift .media { aspect-ratio: 1 / 1; padding: 4px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .45)); }
    .gift .gcat { font-size: 11px; font-weight: 600; margin-top: 6px; color: color-mix(in srgb, var(--c) 55%, #aab3c2); }
    .gift .gname { font-size: 13px; font-weight: 800; margin-top: 1px; line-height: 1.25; max-height: 33px; overflow: hidden; }
    .gift .grow { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
    .gift .gprice { font-size: 12px; font-weight: 800; color: var(--gold); }
    .gift .gpct { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: rgba(0, 0, 0, .35); color: #fff; }
    .gift .btn { width: 100%; margin-top: 8px; }

    .skeleton { height: 200px; border-radius: 18px; background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%); background-size: 200% 100%; animation: shine 1.2s infinite linear; }
    @keyframes shine { to { background-position: -200% 0; } }
    .empty { padding: 28px 18px; text-align: center; }
    .empty .big { font-size: 44px; margin-bottom: 8px; }

    /* ---------- Friends ---------- */
    .friends-hero { padding: 20px 18px; text-align: center; }
    .friends-hero .big { font-size: 46px; }
    .friends-hero h2 { font-size: 20px; margin: 8px 0 6px; }
    .count { font-size: 38px; font-weight: 900; margin: 14px 0 2px; background: linear-gradient(135deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .linkbox { margin-top: 14px; padding: 12px; font-size: 13px; word-break: break-all; text-align: left; background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }

    /* ---------- shaffof pastki menyu (NFT bot uslubi) ---------- */
    .tabbar {
      position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; border-radius: 26px;
      background: rgba(40, 52, 70, .38);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .14);
    }
    .tab {
      background: none; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 0 7px; font-size: 11px; font-weight: 700; color: #c9d3e0; transition: background .2s, color .2s;
    }
    .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
    .tab.active svg { filter: drop-shadow(0 0 6px rgba(255, 255, 255, .4)); }

    /* ---------- bottom sheet ---------- */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .62); display: flex; align-items: flex-end; animation: fade .2s ease; }
    .sheet {
      position: relative; width: 100%; max-height: 92vh; overflow-y: auto;
      background: var(--bg); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
      padding: 14px 14px calc(22px + env(safe-area-inset-bottom)); animation: up .26s ease;
    }
    .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
    .x { position: absolute; top: 12px; right: 12px; z-index: 5; width: 34px; height: 34px; border-radius: 50%; background: var(--card2); font-size: 15px; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
    .hero-media { height: 170px; border-radius: 18px; background: radial-gradient(circle at 50% 40%, rgba(155, 104, 255, .4), rgba(255, 77, 158, .08) 72%), var(--card2); }
    .hero-media .emoji { font-size: 76px; }
    .sheet-title { font-size: 22px; font-weight: 900; margin: 14px 2px 4px; }
    .sheet .row { margin: 10px 2px 12px; }
    .roulette { display: none; position: relative; overflow: hidden; height: 128px; margin: 4px 0 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .roulette.show { display: block; }
    .track { display: flex; gap: 8px; padding: 10px 0; will-change: transform; }
    .mini { --c: var(--r-common); flex: none; width: 92px; height: 106px; padding: 8px 6px 6px; border-radius: 12px; text-align: center; position: relative; overflow: hidden; background: radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--c) 45%, transparent), transparent 75%), color-mix(in srgb, var(--c) 12%, #0e121a); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
    .mini::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 34%; height: 4px; border-radius: 0 0 6px 6px; background: var(--c); }
    .mini .media { height: 62px; }
    .mini .media .emoji { font-size: 30px; }
    .mini .gname { font-size: 11px; font-weight: 700; margin-top: 4px; line-height: 1.2; max-height: 26px; overflow: hidden; }
    .marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--pink); box-shadow: 0 0 14px var(--pink); pointer-events: none; }
    .result { display: none; margin-bottom: 12px; padding: 18px; text-align: center; border-radius: 18px; background: var(--card); border: 1px solid var(--c, var(--line)); animation: pop .35s ease; }
    .result.show { display: block; }
    .result .media { width: 120px; height: 120px; margin: 0 auto; }
    .result .media .emoji { font-size: 64px; }
    .result .rar { margin-top: 10px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--c); }
    .result .rname { font-size: 20px; font-weight: 900; margin: 4px 0; }
    .gatebox { text-align: center; padding: 26px 18px; }
    .gatebox .big { font-size: 46px; }
    .gatebox h2 { font-size: 18px; margin: 10px 0 6px; }

    #toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 80; max-width: 86%; padding: 11px 16px; border-radius: 12px; background: #000c; border: 1px solid var(--line); font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: .25s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
      /* ---------- maxsus (shishali) belgilar ---------- */
    .ic { width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -.2em; overflow: visible; flex: none;
      fill: var(--icf, rgba(255, 255, 255, .16)); stroke: var(--ics, url(#g-glass)); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 1px 1.6px rgba(0, 0, 0, .38)); }

    .ic.red { --ics: url(#g-red); --icf: rgba(255, 90, 90, .22); }

    /* shishali tugma: orqa fonsiz, faqat yarim shaffof kontur va belgi */
    .gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; border-radius: 16px; font-weight: 800; font-size: 14px; color: #eaf2ff;
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03));
      border: 1px solid rgba(255, 255, 255, .22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
      backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); }
    .gbtn:active:not(:disabled) { transform: scale(.97); }
    .gbtn .ic { font-size: 18px; }
    .gbtn.accent { border-color: rgba(255, 210, 120, .5); color: #ffe9b0; }

    /* ---------- Qurilish: to'liq ekran ---------- */

      background: linear-gradient(180deg, #2c8ae0 0%, #67b9f2 36%, #b3e0fa 68%, #e6f5ff 88%); }

      box-shadow: calc(var(--w) * .28) calc(var(--w) * -.14) 0 calc(var(--w) * .04) #fff, calc(var(--w) * -.22) calc(var(--w) * -.08) 0 calc(var(--w) * -.02) #fff;
      animation: bcloud var(--cs, 90s) linear infinite; animation-delay: var(--d); will-change: transform; }

    @keyframes bgR { from { transform: translate3d(-30vw, 0, 0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } to { transform: translate3d(105vw, 0, 0); opacity: 0; } }
    .bworld { position: absolute; inset: 0; will-change: transform; transition: transform .5s ease; }

    .bsndb { position: absolute; right: 12px; top: calc(94px + env(safe-area-inset-top)); z-index: 9; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .78); display: grid; place-items: center; }

    /* ---- asosiy sikl: vaqtga (dt) bog'liq, faqat transform yangilanadi (GPU) ---- */

        BN.data = d; BN.loading = false;
        if (state.tab === "friends") render();
      }).catch(function (e) { BN.loading = false; toast(e.message || "Ulanish yo‘q"); });
    }

    function bnClaim(task) {
      if (BN.busy[task.id]) return;
      BN.busy[task.id] = true;
      request("/api/bonus/claim", { task_id: task.id }).then(function (res) {
        BN.busy[task.id] = false;
        if (res.wallet) applyWallet(res.wallet);
        haptic("success");
        toast(res.status === "approved" ? "🎉 +" + coin(res.reward) + " bonus berildi!" : "So‘rov adminga yuborildi ✅");
        loadBonus();
      }).catch(function (e) {
        BN.busy[task.id] = false; toast(e.message || "Xatolik");
        if (e.code === "claimed" || e.code === "pending") loadBonus();
      });
    }

    var BN_STAT = { approved: ["✅", "Bajarilgan"], pending: ["⏳", "Tekshirilmoqda"], rejected: ["❌", "Rad etilgan"] };

    function viewFriends() {
      var link = referralLink(), d = BN.data;
      var hero = h("div", { class: "card bhero" });
      var wm = ico("gem", "violet wm"); wm.setAttribute("class", "ic violet wm wmk");
      hero.appendChild(wm);
      hero.appendChild(h("h2", null, "Do‘stlarni taklif qiling"));
      hero.appendChild(h("p", { class: "muted" },
        "Har bir ro‘yxatdan o‘tgan do‘stingiz uchun " + (d ? "+" + fmtNum(d.ref_reward) + " 🪙 coin" : "bonus") + " olasiz."));
      var refs = d ? d.referrals : (state.me && state.me.referrals !== undefined ? state.me.referrals : null);
      if (refs !== null) {
        hero.appendChild(h("div", { class: "count" }, String(refs)));
        hero.appendChild(h("div", { class: "muted" }, "Taklif qilingan do‘stlar"));
      }
      if (link) {
        hero.appendChild(h("div", { class: "linkbox" }, link));
        var bCopy = h("button", { class: "gbtn", onclick: function () {
          copyText(link).then(function () { haptic("success"); toast("Havola nusxalandi ✅"); }, function () { toast("Nusxalab bo‘lmadi"); });
        } }, ico("copy"), "Nusxalash");
        var bShare = h("button", { class: "gbtn accent", onclick: function () {
          openLink("https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent("BULLDROP — demo o‘yinlar va sovg‘a qutilari!"));
        } }, ico("share", "gold"), "Ulashish");
        hero.appendChild(h("div", { class: "gact" }, bCopy, bShare));
      } else {
        hero.appendChild(h("p", { class: "note" },
          state.me ? "Bot username sozlanmagan (BOT_USERNAME)." : "Havolani olish uchun Mini App’ni Telegram ichida oching."));
      }

      var page = h("div", null, h("h1", { class: "page-title" }, "💎 Bonus"), hero);
      page.appendChild(h("h3", { class: "sec" }, "🎯 Shartlar"));
      if (!inTG) { page.appendChild(h("div", { class: "card empty" }, h("p", { class: "muted" }, "Shartlarni ko‘rish uchun Telegram ichida oching."))); return page; }
      if (!d) { page.appendChild(h("div", { class: "skeleton", style: "height:120px" })); return page; }
      if (!d.tasks.length) { page.appendChild(h("div", { class: "card empty" }, h("p", { class: "muted" }, "Hozircha shartlar yo‘q."))); return page; }
      var list = h("div", { class: "tasks" });
      d.tasks.forEach(function (t) {
        var st = BN_STAT[t.status];
        var card = h("div", { class: "card task" },
          h("div", { class: "tt" }, ico(t.auto ? "mega" : "link", "sky"), t.title),
          t.description ? h("div", { class: "td" }, t.description) : null,
          h("div", { class: "tr" },
            h("span", { class: "reward" }, "🪙 +" + fmtNum(t.reward)),
            st ? h("span", { class: "tstat " + t.status }, st[0] + " " + st[1]) : null)
        );
        if (t.status !== "approved" && t.status !== "pending") {
          var acts = h("div", { class: "tact" });
          if (t.url) acts.appendChild(h("button", { class: "gbtn", onclick: function () { openLink(t.url); } }, ico("link"), "Bajarish"));
          acts.appendChild(h("button", { class: "gbtn ok", onclick: function () { bnClaim(t); } }, ico("check", "green"), "Bajardim"));
          card.appendChild(acts);
        }
        list.appendChild(card);
      });
      page.appendChild(list);
      return page;
    }

    /* ---------- sotish ---------- */
    function sellOne(it, after) {
      confirmThen("«" + it.name + "» " + coin(it.price) + " ga sotilsinmi?", function () {
        request("/api/sell", { id: it.id }).then(function (res) {
          haptic("success");
          applyWallet(res.wallet);
          state.inv = state.inv.filter(function (x) { return x.id !== it.id; });
          toast("+" + coin(res.gained) + " ✅");
          renderTop();
          if (after) after();
          render();
        }).catch(function (e) { toast(e.message); });
      });
    }

    function sellAll() {
      if (!state.inv.length) return;
      confirmThen("Barcha buyumlar (" + state.inv.length + " ta) sotilsinmi?", function () {
        request("/api/sell", { all: true }).then(function (res) {
          haptic("success");
          applyWallet(res.wallet);
          state.inv = [];
          toast("+" + coin(res.gained) + " ✅");
          renderTop();
          render();
        }).catch(function (e) { toast(e.message); });
      });
    }

    /* ---------- quti sheet ---------- */
    function closeSheet() {
      sheetRoot.textContent = "";
      document.body.style.overflow = "";
    }

    function spin(c, winner, host) {
      return new Promise(function (resolve) {
        host.textContent = "";
        host.classList.add("show");
        var pool = c.items.length ? c.items : [winner];
        var N = 42, W = 36, CARD = 92, GAP = 8, STEP = CARD + GAP;
        var track = h("div", { class: "track" });
        for (var i = 0; i < N; i++) {
          var it = (i === W) ? winner : pool[Math.floor(Math.random() * pool.length)];
          track.appendChild(h("div", { class: "mini", style: "--c:" + rar(it.rarity).color },
            media(it.image_url, "🎁", "", true),
            h("div", { class: "gname" }, it.name)));
        }
        host.appendChild(track);
        host.appendChild(h("div", { class: "marker" }));
        var offset = W * STEP + CARD / 2 - host.clientWidth / 2 + (Math.random() * 30 - 15);
        var finished = false;
        function finish() { if (!finished) { finished = true; resolve(); } }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            track.style.transition = "transform 4.6s cubic-bezier(.12,.7,.08,1)";
            track.style.transform = "translateX(" + (-offset) + "px)";
          });
        });
        track.addEventListener("transitionend", finish);
        setTimeout(finish, 5300);
      });
    }

    function openSheet(c) {
      closeSheet();
      var busy = false;
      var btn = h("button", { class: "btn primary big" });
      var hint = h("p", { class: "note", style: "display:none" });
      var roulette = h("div", { class: "roulette" });
      var result = h("div", { class: "result" });

      function paintBtn() {
        var me = state.me;
        var label, disabled = false, hintText = "";
        if (!inTG) { label = "Telegram ichida oching"; disabled = true; }
        else if (!me || me.gate !== "ok") { label = "Avval ro‘yxatdan o‘ting"; disabled = true; }
        else if (!c.items.length) { label = "Sovg‘a qo‘shilmagan"; disabled = true; }
        else if (c.price > 0 && me.free_left <= 0 && me.coins < c.price) {
          label = "🪙 " + coin(c.price) + " bilan ochish";
          disabled = true;
          hintText = "Coin yetarli emas. «Buyumlar» bo‘limida sovg‘alarni soting.";
        }
        else if (me.free_left > 0) label = "🎟 Bepul ochish (qoldi: " + me.free_left + ")";
        else label = c.price > 0 ? "🪙 " + coin(c.price) + " bilan ochish" : "🎁 Ochish";
        btn.textContent = busy ? "Ochilmoqda..." : label;
        btn.disabled = disabled || busy;
        hint.textContent = hintText;
        hint.style.display = hintText ? "" : "none";
      }

      function showResult(res) {
        var r = rar(res.item.rarity);
        roulette.classList.remove("show");
        result.textContent = "";
        result.style.setProperty("--c", r.color);
        result.appendChild(media(res.item.image_url, "🎁", "", true));
        result.appendChild(h("div", { class: "rar" }, r.label));
        result.appendChild(h("div", { class: "rname" }, res.item.name));
        result.appendChild(h("div", { class: "pill" }, coin(res.item.price)));
        result.appendChild(h("div", { class: "btnrow" },
          h("button", { class: "btn", onclick: function () { result.classList.remove("show"); } }, "🎒 Qolsin"),
          h("button", { class: "btn primary", onclick: function () {
            sellOne(res.item, function () { result.classList.remove("show"); paintBtn(); });
          } }, "💰 Sotish")
        ));
        result.classList.add("show");
      }

      btn.addEventListener("click", function () {
        if (busy) return;
        busy = true;
        paintBtn();
        result.classList.remove("show");
        haptic();
        request("/api/open", { case_id: c.id }).then(function (res) {
          applyWallet(res.wallet);
          state.inv.unshift(res.item);
          state.invLoaded = true;
          renderTop();
          return spin(c, res.item, roulette).then(function () { return res; });
        }).then(function (res) {
          haptic("success");
          showResult(res);
        }).catch(function (e) {
          roulette.classList.remove("show");
          toast(e.message || "Xatolik");
        }).then(function () {
          busy = false;
          paintBtn();
        });
      });

      paintBtn();
      var sheet = h("div", { class: "sheet", onclick: function (e) { e.stopPropagation(); } },
        h("div", { class: "grab" }),
        h("button", { class: "x", "aria-label": "Yopish", onclick: closeSheet }, "✕"),
        media(c.image_url, "🎁", "hero-media"),
        h("h2", { class: "sheet-title" }, c.name),
        c.description ? h("p", { class: "muted" }, c.description) : null,
        h("div", { class: "row between" },
          h("span", { class: "pill" }, "Narxi: " + coin(c.price)),
          h("span", { class: "muted" }, c.items.length + " ta sovg‘a")),
        roulette,
        result,
        btn,
        hint,
        h("h3", { class: "sec" }, "Qutidagi sovg‘alar"),
        c.items.length
          ? h("div", { class: "grid3" }, c.items.map(function (i) { return giftCard(i, { percent: true }); }))
          : h("p", { class: "muted" }, "Bu qutiga hali sovg‘a qo‘shilmagan.")
      );
      sheetRoot.appendChild(h("div", { class: "overlay", onclick: closeSheet }, sheet));
      document.body.style.overflow = "hidden";
    }

    /* ---------- navigatsiya va yuklash ---------- */
    function visibleTabs() {
      var list = TABS.slice();
      if (state.me && state.me.is_admin) list.push({ id: "admin", label: "Admin", icon: "shield" });
      return list;
    }

    function buildTabs() {
      var list = visibleTabs();
      tabbar.textContent = "";
      tabbar.style.gridTemplateColumns = "repeat(" + list.length + ", 1fr)";
      list.forEach(function (t) {
        var b = h("button", { class: "tab", "data-tab": t.id, onclick: function () { go(t.id); } });
        b.innerHTML = ICONS[t.icon];
        b.appendChild(h("span", null, t.label));
        tabbar.appendChild(b);
      });
    }

    function syncBack() {
      try {
        if (!tg || !tg.BackButton) return;
        if (GAME_TABS.indexOf(state.tab) >= 0) tg.BackButton.show(); else tg.BackButton.hide();
      } catch (e) {}
    }
    try {
      if (tg && tg.BackButton) tg.BackButton.onClick(function () {
        if (GAME_TABS.indexOf(state.tab) >= 0) { document.body.classList.remove("imm"); go("games"); }
      });
    } catch (e) {}

    function go(tab) {
      if (tab !== state.tab) haptic();
      state.tab = tab;
      syncBack();
      closeSheet();
      if (tab === "inv" && inTG && !state.invLoaded) loadInv();
      if (tab === "admin") loadAdmin();
      if (tab === "wheel") loadWheel();
      if (tab === "mines") loadMines();
      if (tab === "tower") loadTower();
      if (tab === "ladder") loadLadder();
      if (tab === "build") loadBuild();
      if (tab === "friends" && inTG) loadBonus();
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      Array.prototype.forEach.call(tabbar.children, function (b) {
        b.classList.toggle("active", b.getAttribute("data-tab") === state.tab || (b.getAttribute("data-tab") === "games" && GAME_TABS.indexOf(state.tab) >= 0));
      });
      renderTop();
      document.body.classList.remove("imm");
      view.textContent = "";
      try {
        if (inTG && state.me && state.me.gate && state.me.gate !== "ok") {
          view.appendChild(gateCard(state.me));
        } else if (state.tab === "case") view.appendChild(viewCases());
        else if (state.tab === "inv") view.appendChild(viewInv());
        else if (state.tab === "friends") view.appendChild(viewFriends());
        else if (state.tab === "games") view.appendChild(viewGames());
        else if (state.tab === "admin") view.appendChild(viewAdmin());
        else if (state.tab === "wheel") view.appendChild(viewWheel());
        else if (state.tab === "mines") view.appendChild(viewMines());
        else if (state.tab === "tower") view.appendChild(viewTower());
        else if (state.tab === "ladder") view.appendChild(viewLadder());
        else if (state.tab === "build") view.appendChild(viewBuild());
        else view.appendChild(viewHome());
      } catch (e) {
        view.appendChild(h("div", { class: "card empty" }, h("p", null, "Xatolik: " + e.message)));
      }
    }

    function refreshMe() {
      if (!inTG) return;
      request("/api/me", {}).then(function (me) {
        state.me = me;
        buildTabs();
        if (me.gate === "ok" && !state.invLoaded) loadInv();
        render();
      }).catch(function (e) { toast(e.message); });
    }

    function loadInv() {
      if (!inTG) return;
      request("/api/inventory", {}).then(function (d) {
        state.inv = d.items || [];
        applyWallet(d.wallet);
        state.invLoaded = true;
        render();
      }).catch(function (e) {
        state.invLoaded = true;
        toast(e.message);
        render();
      });
    }

    function load() {
      state.loaded = false;
      state.error = "";
      render();
      request("/api/cases")
        .then(function (d) {
          state.cases = d.cases || [];
          state.banner = d.banner || null;
          state.freeLimit = d.free_limit || state.freeLimit;
          state.hero = d.hero || null;
        })
        .catch(function () { state.error = "Qutilarni yuklab bo‘lmadi. Internetni tekshiring."; })
        .then(function () { state.loaded = true; render(); });
      if (inTG) refreshMe();
    }

    window.addEventListener("error", function (e) {
      if (!view.firstChild) view.appendChild(h("div", { class: "card empty" }, h("p", null, "Xatolik: " + e.message)));
    });

    buildTabs();
    load();
    try {
      var gm = new URLSearchParams(location.search).get("game");
      if (gm === "wheel" || gm === "mines" || gm === "tower" || gm === "ladder" || gm === "build") go(gm);
    } catch (e) {}
  })();
  </script>
</body>
</html>
