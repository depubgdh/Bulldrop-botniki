<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101722">
  <title>BULLDROP — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101722;
      --card: #1b2735;
      --card2: #223247;
      --line: #334256;
      --text: #f4f6fa;
      --muted: #a9b5c5;
      --pink: #ff4d9e;
      --purple: #9b68ff;
      --gold: #e4b85c;
      --r-common: #8794a8;
      --r-rare: #4da3ff;
      --r-epic: #9b68ff;
      --r-legendary: #e4b85c;
      --r-mythic: #ff4d9e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 14px 14px calc(110px + env(safe-area-inset-bottom));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }

    .muted { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .note { color: var(--muted); font-size: 12px; text-align: center; margin: 12px 0 4px; line-height: 1.4; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { justify-content: space-between; }
    .page-title { font-size: 22px; font-weight: 800; margin: 4px 2px 14px; }
    .sec { font-size: 16px; font-weight: 700; margin: 20px 2px 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }

    /* ---------- ust qism: balans chiplari ---------- */
    .chips { display: flex; gap: 8px; justify-content: flex-end; margin: 0 2px 12px; flex-wrap: wrap; }
    .chip {
      display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, .06); border: 1px solid var(--line); font-size: 13px; color: var(--muted);
    }
    .chip b { color: var(--text); }
    .chip.gold { border-color: rgba(228, 184, 92, .4); color: var(--gold); }
    .chip.gold b { color: var(--gold); }

    /* ---------- Home ---------- */
    .profile { display: flex; align-items: center; gap: 12px; margin: 2px 2px 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line); flex: none; }
    .avatar .emoji { font-size: 20px; font-weight: 700; }
    .hello { font-size: 13px; color: var(--muted); }
    .uname { font-size: 18px; font-weight: 800; }
    .hero {
      border-radius: 22px; padding: 20px 18px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      box-shadow: 0 10px 30px rgba(155, 104, 255, .28);
    }
    .hero h2 { font-size: 24px; font-weight: 900; letter-spacing: .5px; }
    .hero p { margin: 6px 0 16px; font-size: 14px; line-height: 1.4; opacity: .95; }
    .hero { position: relative; overflow: hidden; }
    .hero.has-img { min-height: 210px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg .media { width: 100%; height: 100%; border-radius: 0; }
    .hero-bg img, .hero-bg video { width: 100%; height: 100%; object-fit: cover; }
    .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 14, 22, .10), rgba(10, 14, 22, .78)); }
    .hero-content { position: relative; }
    .wheelcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; margin-top: 12px; }
    .wic { font-size: 30px; }
    .wheel-wrap { position: relative; width: 300px; max-width: 86vw; margin: 8px auto 6px; }
    .wheel-wrap svg { width: 100%; height: auto; display: block; }
    .wheel-pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #fff; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5)); }
    .bets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
    .chipbtn { padding: 9px 14px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
    .chipbtn.on { background: linear-gradient(135deg, var(--pink), var(--purple)); border: 0; color: #fff; }
    .betinput { width: 100%; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--text); font-size: 16px; text-align: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: var(--muted); }
    .kv b { text-align: right; word-break: break-word; }
    .banner { display: block; width: 100%; padding: 0; overflow: hidden; border-radius: 18px; margin-bottom: 12px; }
    .banner .media { aspect-ratio: 16 / 7; border-radius: 18px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .stat { padding: 12px 8px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
    .hscroll::-webkit-scrollbar { display: none; }

    /* ---------- tugmalar ---------- */
    .btn {
      position: relative; border-radius: 16px; padding: 12px 16px; font-weight: 800; color: #fff;
      background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05));
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -8px 14px rgba(255, 255, 255, .03), 0 6px 18px rgba(0, 0, 0, .28);
      -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn::after { content: ""; position: absolute; left: 12%; right: 12%; top: 2px; height: 42%; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent); pointer-events: none; }
    .btn.primary {
      background: linear-gradient(135deg, rgba(255, 79, 163, .78), rgba(143, 90, 255, .78));
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 24px rgba(214, 80, 220, .35);
    }
    .btn.white {
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .78)); color: #1b1030;
      border: 1px solid rgba(255, 255, 255, .8);
      box-shadow: inset 0 1px 0 #fff, 0 8px 22px rgba(0, 0, 0, .25);
    }
    .btn.white::after { display: none; }
    .btn:disabled { opacity: .5; }
    .btn.big { width: 100%; padding: 15px; font-size: 16px; }
    .btn.small { padding: 9px 10px; font-size: 13px; border-radius: 13px; width: 100%; margin-top: 8px; }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    /* ---------- media ---------- */
    .media { display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .media img, .media video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .media .emoji { font-size: 36px; line-height: 1; }
    .lottie { width: 100%; height: 100%; }
    .lottie svg { width: 100% !important; height: 100% !important; }

    /* ---------- kartalar ---------- */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .case {
      padding: 10px; text-align: left; width: 100%;
      background: var(--card); border: 1px solid var(--line); border-radius: 18px; transition: transform .12s ease;
    }
    .case:active { transform: scale(.97); }
    .case .media {
      aspect-ratio: 1 / 1; border-radius: 14px;
      background: radial-gradient(circle at 50% 35%, rgba(155, 104, 255, .35), rgba(255, 77, 158, .08) 70%), var(--card2);
    }
    .case .media .emoji { font-size: 56px; }
    .case .name { font-weight: 800; font-size: 15px; margin: 10px 2px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .case .sub { color: var(--muted); font-size: 12px; margin: 0 2px 8px; }
    .pill {
      display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800;
      background: rgba(228, 184, 92, .14); color: var(--gold); border: 1px solid rgba(228, 184, 92, .35);
    }
    .gift {
      --c: var(--r-common);
      position: relative; overflow: hidden; min-width: 0; text-align: left;
      padding: 14px 10px 10px; border-radius: 16px;
      background:
        radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--c) 46%, transparent), transparent 75%),
        linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, #0e121a), color-mix(in srgb, var(--c) 8%, #0e121a));
      border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
    }
    .gift::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 34%; height: 5px; border-radius: 0 0 8px 8px; background: var(--c);
      box-shadow: 0 2px 14px var(--c);
    }
    .gift.small { width: 124px; flex: none; }
    .gift .media { aspect-ratio: 1 / 1; padding: 4px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .45)); }
    .gift .gcat { font-size: 11px; font-weight: 600; margin-top: 6px; color: color-mix(in srgb, var(--c) 55%, #aab3c2); }
    .gift .gname { font-size: 13px; font-weight: 800; margin-top: 1px; line-height: 1.25; max-height: 33px; overflow: hidden; }
    .gift .grow { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
    .gift .gprice { font-size: 12px; font-weight: 800; color: var(--gold); }
    .gift .gpct { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: rgba(0, 0, 0, .35); color: #fff; }
    .gift .btn { width: 100%; margin-top: 8px; }

    .skeleton { height: 200px; border-radius: 18px; background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%); background-size: 200% 100%; animation: shine 1.2s infinite linear; }
    @keyframes shine { to { background-position: -200% 0; } }
    .empty { padding: 28px 18px; text-align: center; }
    .empty .big { font-size: 44px; margin-bottom: 8px; }

    /* ---------- Friends ---------- */
    .friends-hero { padding: 20px 18px; text-align: center; }
    .friends-hero .big { font-size: 46px; }
    .friends-hero h2 { font-size: 20px; margin: 8px 0 6px; }
    .count { font-size: 38px; font-weight: 900; margin: 14px 0 2px; background: linear-gradient(135deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .linkbox { margin-top: 14px; padding: 12px; font-size: 13px; word-break: break-all; text-align: left; background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }

    /* ---------- shaffof pastki menyu (NFT bot uslubi) ---------- */
    .tabbar {
      position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; border-radius: 26px;
      background: rgba(40, 52, 70, .38);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .14);
    }
    .tab {
      background: none; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 0 7px; font-size: 11px; font-weight: 700; color: #c9d3e0; transition: background .2s, color .2s;
    }
    .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
    .tab.active svg { filter: drop-shadow(0 0 6px rgba(255, 255, 255, .4)); }

    /* ---------- bottom sheet ---------- */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .62); display: flex; align-items: flex-end; animation: fade .2s ease; }
    .sheet {
      position: relative; width: 100%; max-height: 92vh; overflow-y: auto;
      background: var(--bg); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
      padding: 14px 14px calc(22px + env(safe-area-inset-bottom)); animation: up .26s ease;
    }
    .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
    .x { position: absolute; top: 12px; right: 12px; z-index: 5; width: 34px; height: 34px; border-radius: 50%; background: var(--card2); font-size: 15px; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
    .hero-media { height: 170px; border-radius: 18px; background: radial-gradient(circle at 50% 40%, rgba(155, 104, 255, .4), rgba(255, 77, 158, .08) 72%), var(--card2); }
    .hero-media .emoji { font-size: 76px; }
    .sheet-title { font-size: 22px; font-weight: 900; margin: 14px 2px 4px; }
    .sheet .row { margin: 10px 2px 12px; }
    .roulette { display: none; position: relative; overflow: hidden; height: 128px; margin: 4px 0 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .roulette.show { display: block; }
    .track { display: flex; gap: 8px; padding: 10px 0; will-change: transform; }
    .mini { --c: var(--r-common); flex: none; width: 92px; height: 106px; padding: 8px 6px 6px; border-radius: 12px; text-align: center; position: relative; overflow: hidden; background: radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--c) 45%, transparent), transparent 75%), color-mix(in srgb, var(--c) 12%, #0e121a); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
    .mini::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 34%; height: 4px; border-radius: 0 0 6px 6px; background: var(--c); }
    .mini .media { height: 62px; }
    .mini .media .emoji { font-size: 30px; }
    .mini .gname { font-size: 11px; font-weight: 700; margin-top: 4px; line-height: 1.2; max-height: 26px; overflow: hidden; }
    .marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--pink); box-shadow: 0 0 14px var(--pink); pointer-events: none; }
    .result { display: none; margin-bottom: 12px; padding: 18px; text-align: center; border-radius: 18px; background: var(--card); border: 1px solid var(--c, var(--line)); animation: pop .35s ease; }
    .result.show { display: block; }
    .result .media { width: 120px; height: 120px; margin: 0 auto; }
    .result .media .emoji { font-size: 64px; }
    .result .rar { margin-top: 10px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--c); }
    .result .rname { font-size: 20px; font-weight: 900; margin: 4px 0; }
    .gatebox { text-align: center; padding: 26px 18px; }
    .gatebox .big { font-size: 46px; }
    .gatebox h2 { font-size: 18px; margin: 10px 0 6px; }

    #toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 80; max-width: 86%; padding: 11px 16px; border-radius: 12px; background: #000c; border: 1px solid var(--line); font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: .25s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <header id="top"></header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet-root"></div>
  <div id="toast"></div>
  <noscript>Mini App ishlashi uchun JavaScript yoqilgan bo‘lishi kerak.</noscript>

  <script>
  (function () {
    "use strict";

    var tg = window.Telegram && window.Telegram.WebApp;
    var inTG = !!(tg && tg.initData);
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#101722");
        if (tg.setBackgroundColor) tg.setBackgroundColor("#101722");
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      }
    } catch (e) { /* eski Telegram versiyalari */ }

    var RARITY = {
      common:    { label: "Oddiy",     color: "var(--r-common)" },
      rare:      { label: "Noyob",     color: "var(--r-rare)" },
      epic:      { label: "Epik",      color: "var(--r-epic)" },
      legendary: { label: "Afsonaviy", color: "var(--r-legendary)" },
      mythic:    { label: "Mifik",     color: "var(--r-mythic)" }
    };
    function rar(key) { return RARITY[key] || RARITY.common; }

    var ICONS = {
      home:    '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
      gift:    '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18"/><path d="M12 8v12"/><path d="M12 8c-2.5 0-4-1-4-2.5S9.5 3 12 8c2.5-5 4-3.5 4-2.5S14.5 8 12 8z"/></svg>',
      bag:     '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
      shield:  '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9.5 12l2 2 3.5-4"/></svg>',
      friends: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/></svg>'
    };
    var TABS = [
      { id: "home", label: "Bosh", icon: "home" },
      { id: "case", label: "Qutilar", icon: "gift" },
      { id: "inv", label: "Buyumlar", icon: "bag" },
      { id: "friends", label: "Do‘stlar", icon: "friends" }
    ];
    var GATE_TEXT = {
      register: "Avval botda /start bosib ro‘yxatdan o‘ting.",
      subscribe: "Davom etish uchun kanalga a‘zo bo‘ling."
    };

    var state = {
      tab: "home", cases: [], banner: null, hero: null, freeLimit: 10, adminData: null,
      wheel: { data: null, bet: 10, count: 1, rot: 0, busy: false, pending: null, result: null },
      loaded: false, error: "", me: null,
      inv: [], invLoaded: false
    };

    var view = document.getElementById("view");
    var topEl = document.getElementById("top");
    var tabbar = document.getElementById("tabbar");
    var sheetRoot = document.getElementById("sheet-root");
    var toastEl = document.getElementById("toast");

    /* ---------- yordamchilar ---------- */
    function h(tag, attrs) {
      var n = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") n.className = v;
        else if (k === "style") n.style.cssText = v;
        else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      });
      for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
      return n;
    }
    function append(parent, kid) {
      if (kid === null || kid === undefined || kid === false) return;
      if (Array.isArray(kid)) { kid.forEach(function (k) { append(parent, k); }); return; }
      if (typeof kid === "string" || typeof kid === "number") parent.appendChild(document.createTextNode(String(kid)));
      else parent.appendChild(kid);
    }

    function fmtNum(n) {
      return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }
    function coin(n) { return fmtNum(n) + " coin"; }

    function safeUrl(u) {
      if (!u) return "";
      try {
        var x = new URL(u, location.href);
        return (x.protocol === "https:" || x.protocol === "http:") ? x.href : "";
      } catch (e) { return ""; }
    }
    function mediaKind(url) {
      if (/\/media\/tgs\//.test(url)) return "lottie";
      if (/\/media\/vid\//.test(url) || /\.(mp4|webm)(\?|#|$)/i.test(url)) return "video";
      return "image";
    }

    function ensureLottie() {
      if (window.lottie) return Promise.resolve();
      if (!window.__lottiePromise) {
        window.__lottiePromise = new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      return window.__lottiePromise;
    }

    /* Oq (yoki deyarli oq) fonli rasmdan fonni olib tashlaydi: chetdan boshlab oq piksellarni shaffof qiladi. */
    var cutCache = {};
    function cutout(src) {
      if (cutCache[src]) return cutCache[src];
      cutCache[src] = new Promise(function (resolve, reject) {
        var im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = function () {
          try {
            var k = Math.min(1, 480 / Math.max(im.naturalWidth, im.naturalHeight));
            var w = Math.max(1, Math.round(im.naturalWidth * k)), hh = Math.max(1, Math.round(im.naturalHeight * k));
            var cv = document.createElement("canvas");
            cv.width = w; cv.height = hh;
            var cx = cv.getContext("2d", { willReadFrequently: true });
            cx.drawImage(im, 0, 0, w, hh);
            var img = cx.getImageData(0, 0, w, hh), d = img.data;
            var mode = "white";
            function isWhite(i) { return d[i + 3] <= 10 || Math.min(d[i], d[i + 1], d[i + 2]) >= 236; }
            function isBlack(i) { return d[i + 3] <= 10 || Math.max(d[i], d[i + 1], d[i + 2]) <= 28; }
            function ratio(fn) {
              var e = 0, t = 0, x, y;
              for (x = 0; x < w; x++) { t += 2; if (fn(x * 4)) e++; if (fn(((hh - 1) * w + x) * 4)) e++; }
              for (y = 0; y < hh; y++) { t += 2; if (fn(y * w * 4)) e++; if (fn((y * w + w - 1) * 4)) e++; }
              return e / t;
            }
            var x, y;
            /* fon oq, qora yoki shaffof bo'lsa kesiladi (Telegram rasmni JPEG qilib, shaffoflikni qoraga aylantiradi) */
            if (ratio(isWhite) >= 0.85) mode = "white";
            else if (ratio(isBlack) >= 0.85) mode = "black";
            else { resolve(src); return; }
            var white = mode === "white" ? isWhite : isBlack;
            var seen = new Uint8Array(w * hh), stack = [];
            function push(px, py) {
              if (px < 0 || py < 0 || px >= w || py >= hh) return;

              if (seen[p] || !white(p * 4)) return;

            for (x = 0; x < w; x++) { push(x, 0); push(x, hh - 1); }
            for (y = 0; y < hh; y++) { push(0, y); push(w - 1, y); }
            while (stack.length) {
              var p = stack.pop(), px = p % w, py = (p - px) / w;
              d[p * 4 + 3] = 0;
              push(px + 1, py); push(px - 1, py); push(px, py + 1); push(px, py - 1);
            }
            /* chetni yumshatish: shaffofga tegib turgan och piksellarni qisman shaffof qilish */
            for (y = 1; y < hh - 1; y++) for (x = 1; x < w - 1; x++) {
              var q = y * w + x;
              if (seen[q]) continue;
              if (seen[q - 1] || seen[q + 1] || seen[q - w] || seen[q + w]) {
                if (mode === "white") {
                  var m = Math.min(d[q * 4], d[q * 4 + 1], d[q * 4 + 2]);
                  if (m > 190) d[q * 4 + 3] = Math.round(255 * (236 - m) / 46);
                } else {
                  var mb = Math.max(d[q * 4], d[q * 4 + 1], d[q * 4 + 2]);
                  if (mb < 70) d[q * 4 + 3] = Math.round(255 * Math.max(0, mb - 28) / 42);
                }
              }
            }
            cx.putImageData(img, 0, 0);
            /* shaffof bo'sh joyni kesib, sovg'ani kadrga to'ldirish */
            var x0 = w, y0 = hh, x1 = -1, y1 = -1;
            for (y = 0; y < hh; y++) for (x = 0; x < w; x++) {
              if (d[(y * w + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
            }
            if (x1 < x0 || y1 < y0) { resolve(src); return; }
            var pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.04);
            x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(hh - 1, y1 + pad);
            var out = document.createElement("canvas");
            out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
            out.getContext("2d").drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
            resolve(out.toDataURL("image/png"));
          } catch (e) { reject(e); }
        };
        im.onerror = function () { reject(new Error("img")); };
        im.src = src;
      });
      return cutCache[src];
    }

        loadLottie(src, holder).catch(fallback);

      var el;
      if (kind === "video") {
        el = h("video", { src: src, autoplay: "", loop: "", playsinline: "", preload: "auto" });
        el.muted = true;
        el.setAttribute("muted", "");
      } else {

        try { local = new URL(src, location.href).origin === location.origin; } catch (e) {}

          el.addEventListener("error", fallback);

          box.appendChild(el);

    var WHEEL_COLORS = { lose: "#3a4658", x0: "#4da3ff", x2: "#9b68ff", x5: "#e4b85c", x10: "#ff4d9e" };

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function randomId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

    function wheelSvg(sectors, rot) {
      var N = sectors.length, R = 140, C = 150, step = 360 / N;
      var pt = function (deg, r) { var a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
      var parts = [];
      sectors.forEach(function (s, i) {
        var a0 = i * step, a1 = (i + 1) * step;
        var p0 = pt(a0, R), p1 = pt(a1, R);
        var fill = s.locked ? "#222b38" : WHEEL_COLORS[s.type];
        parts.push('<path d="M' + C + ',' + C + ' L' + p0[0] + ',' + p0[1] + ' A' + R + ',' + R + ' 0 0 1 ' + p1[0] + ',' + p1[1] + ' Z" fill="' + fill + '" stroke="#101722" stroke-width="1"/>');
        if (!s.locked && s.type !== "lose") {
          var mid = (a0 + a1) / 2, t = pt(mid, R * 0.72);
          parts.push('<text x="' + t[0] + '" y="' + t[1] + '" fill="#fff" font-size="9" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(' + mid + ' ' + t[0] + ' ' + t[1] + ')">' + s.label + '</text>');
        }
      });
      return '<svg viewBox="0 0 300 300"><g id="wheelg" style="transform-origin:150px 150px;transform:rotate(' + rot + 'deg)">' +
        parts.join("") + '</g><circle cx="150" cy="150" r="10" fill="#101722" stroke="#fff" stroke-width="2"/></svg>';
    }

    /* Natija sektorini tepadagi ko‘rsatkichga olib keladigan burilish (kamida 3 marta aylanib). */
    function landRot(cur, idx, N) {
      var step = 360 / N;
      var target = (360 - (idx * step + step / 2)) % 360;
      var base = cur - (((cur % 360) + 360) % 360);
      var rot = base + target;
      while (rot <= cur + 1080) rot += 360;
      return rot;
    }

      w.pending = p;

      w.result = null;
      render();
      request("/api/wheel/spin", { bet: p.bet, count: p.count, request_id: p.request_id }).then(function (res) {
        w.pending = null;
        applyBalance(res.balance);
        var N = w.data.sectors.length;
        var last = res.results[res.results.length - 1];
        w.rot = landRot(w.rot, last, N);
        var g = document.getElementById("wheelg");
        if (g) {
          g.style.transition = "transform 4.2s cubic-bezier(.12,.7,.08,1)";
          g.style.transform = "rotate(" + w.rot + "deg)";

        return sleep(4300).then(function () {
          w.busy = false;
          w.result = res;
          w.data.last = res;
          haptic("success");
          render();
        });
      }).catch(function (e) {
        w.busy = false;
        if (e.code) w.pending = null; /* server rad etdi: qayta urinishda yangi so‘rov */

          h("div", { class: "rar" }, r.count + " ta o‘yin"),
          h("div", { class: "rname" }, (r.net >= 0 ? "+" : "−") + coin(Math.abs(r.net))),
          h("p", { class: "muted" }, "Tikish: " + coin(r.total_bet) + " · Qaytim: " + coin(r.total_payout))
        ));
      } else if (d.last) {
        page.appendChild(h("p", { class: "note" },
          "Oxirgi o‘yin: " + (d.last.net >= 0 ? "+" : "−") + coin(Math.abs(d.last.net))));
      }

      page.appendChild(h("h3", { class: "sec" }, "Tikish miqdori"));
      page.appendChild(h("div", { class: "bets" }, d.bet_presets.map(function (v) {
        return h("button", { class: "chipbtn" + (w.bet === v ? " on" : ""), onclick: function () { w.bet = v; render(); } }, String(v));
      })));
      var input = h("input", { class: "betinput", type: "number", min: String(d.min_bet), max: String(d.max_bet), value: String(w.bet) });
      input.addEventListener("change", function () {
        var v = parseInt(input.value, 10);
        if (isNaN(v) || v < d.min_bet || v > d.max_bet) { toast("Tikish " + d.min_bet + " dan " + d.max_bet + " gacha bo‘lishi kerak."); }
        else { w.bet = v; }
        render();
      });
      page.appendChild(input);

      page.appendChild(h("h3", { class: "sec" }, "Avtomatik o‘yinlar soni"));
      page.appendChild(h("div", { class: "bets" }, d.auto_options.map(function (v) {
        return h("button", { class: "chipbtn" + (w.count === v ? " on" : ""), onclick: function () { w.count = v; render(); } }, v + " ta");
      })));

      page.appendChild(h("button", { class: "btn primary big", style: "margin-top:8px", disabled: w.busy ? "" : null, onclick: spinWheel },
        w.busy ? "Aylanmoqda..." : "🎡 O‘ynash — " + fmtNum(w.bet * w.count) + " coin"));

      /* Sektorlar ro‘yxati */
      var kinds = {};
      d.sectors.forEach(function (s) {
        if (!kinds[s.type]) kinds[s.type] = { label: s.label, coef: s.coef, count: 0, locked: false };
        kinds[s.type].count += 1;
        if (s.locked) kinds[s.type].locked = true;
      });
      var rows = Object.keys(kinds).map(function (k) {
        var x = kinds[k];
        var rowText = x.coef < 0 ? "Tikish yo‘qoladi" : (x.coef === 0 ? "Tikish qaytadi" : "Qaytim: tikish × " + (1 + x.coef));
        return h("div", { class: "kv" },
          h("span", null, h("i", { class: "dot", style: "background:" + WHEEL_COLORS[k] }), x.label + " (" + x.count + " ta)"),
          h("b", null, x.locked ? "🔒 " + rowText : rowText));
      });
      page.appendChild(h("h3", { class: "sec" }, "Sektorlar"));
      page.appendChild(h("div", { class: "card" }, rows));
      page.appendChild(h("p", { class: "note" }, "Qaytim = tikish + tikish × koeffitsiyent. Natijalar tasodifiy."));
      return page;
    }

    function loadAdmin() {
      if (!(state.me && state.me.is_admin)) return;
      request("/api/admin/overview", {}).then(function (d) {
        state.adminData = d;
        render();
      }).catch(function (e) { toast(e.message); });
    }

    function viewCases() {
      var page = h("div", null, h("h1", { class: "page-title" }, "🎁 Qutilar"));
      if (!state.loaded) {
        page.appendChild(h("div", { class: "grid2" }, [1, 2, 3, 4].map(function () { return h("div", { class: "skeleton" }); })));
        return page;
      }
      if (state.error) {
        page.appendChild(h("div", { class: "card empty" },
          h("div", { class: "big" }, "⚠️"),
          h("p", { class: "muted" }, state.error),
          h("button", { class: "btn primary", style: "margin-top:14px", onclick: load }, "Qayta urinish")
        ));
        return page;
      }
      if (!state.cases.length) {
        page.appendChild(h("div", { class: "card empty" },
          h("div", { class: "big" }, "📦"),
          h("p", null, "Hozircha qutilar yo‘q."),
          h("p", { class: "muted", style: "margin-top:6px" }, "Qutilar tez orada qo‘shiladi.")
        ));
        return page;
      }
      page.appendChild(h("div", { class: "grid2" }, state.cases.map(caseCard)));
      return page;
    }

    function viewInv() {
      var page = h("div", null, h("h1", { class: "page-title" }, "🎒 Buyumlar"));
      if (!inTG) {
        page.appendChild(h("div", { class: "card empty" }, h("p", { class: "muted" }, "Buyumlarni ko‘rish uchun Telegram ichida oching.")));
        return page;
      }
      if (!state.invLoaded) {
        page.appendChild(h("div", { class: "grid2" }, [1, 2].map(function () { return h("div", { class: "skeleton" }); })));
        return page;
      }
      if (!state.inv.length) {
        page.appendChild(h("div", { class: "card empty" },
          h("div", { class: "big" }, "🎒"),
          h("p", null, "Hozircha buyumlaringiz yo‘q."),
          h("button", { class: "btn primary", style: "margin-top:14px", onclick: function () { go("case"); } }, "🎁 Quti ochish")
        ));
        return page;
      }
      var total = state.inv.reduce(function (s, i) { return s + Number(i.price || 0); }, 0);
      page.appendChild(h("div", { class: "card", style: "padding:14px 16px;margin-bottom:12px" },
        h("div", { class: "row between" },
          h("div", null, h("div", { class: "muted" }, "Sotish mumkin bo‘lgan qiymat"), h("b", { style: "font-size:18px" }, coin(total))),
          h("span", { class: "pill" }, state.inv.length + " ta")
        ),
        h("button", { class: "btn small", style: "margin-top:12px", onclick: sellAll }, "💰 Hammasini sotish")
      ));
      page.appendChild(h("p", { class: "muted", style: "margin:0 2px 12px" }, "Sotsangiz coin olasiz — bu coin bilan yana quti ochasiz."));
      page.appendChild(h("div", { class: "grid2" }, state.inv.map(invCard)));
      return page;
    }

    function referralLink() {
      if (!state.me || !state.me.bot_username) return "";
      return "https://t.me/" + state.me.bot_username + "?start=ref_" + state.me.id;
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
      return new Promise(function (resolve, reject) {
        try {
          var ta = h("textarea", { style: "position:fixed;opacity:0" });
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          resolve();
        } catch (e) { reject(e); }
      });
    }

    function viewFriends() {
      var link = referralLink();
      var box = h("div", { class: "card friends-hero" },
        h("div", { class: "big" }, "👥"),
        h("h2", null, "Do‘stlarni taklif qiling"),
        h("p", { class: "muted" }, "Havolangiz orqali botga qo‘shilib, ro‘yxatdan o‘tgan do‘stlar shu yerda hisoblanadi.")
      );
      if (state.me && state.me.referrals !== undefined) {
        box.appendChild(h("div", { class: "count" }, String(state.me.referrals)));
        box.appendChild(h("div", { class: "muted" }, "Taklif qilingan do‘stlar"));
      }
      if (link) {
        box.appendChild(h("div", { class: "linkbox" }, link));
        box.appendChild(h("div", { class: "btnrow" },
          h("button", { class: "btn", onclick: function () {
            copyText(link).then(function () { haptic("success"); toast("Havola nusxalandi ✅"); },
                                function () { toast("Nusxalab bo‘lmadi"); });
          } }, "📋 Nusxalash"),
          h("button", { class: "btn primary", onclick: function () {
            openLink("https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent("BULLDROP — qutilarni oching 🎁"));
          } }, "📤 Ulashish")
        ));
      } else {
        box.appendChild(h("p", { class: "note" },
          state.me ? "Bot username sozlanmagan (BOT_USERNAME)." : "Havolani olish uchun Mini App’ni Telegram ichida oching."));
      }
      return h("div", null, h("h1", { class: "page-title" }, "👥 Do‘stlar"), box);
    }

    /* ---------- sotish ---------- */
    function sellOne(it, after) {
      confirmThen("«" + it.name + "» " + coin(it.price) + " ga sotilsinmi?", function () {
        request("/api/sell", { id: it.id }).then(function (res) {
          haptic("success");
          applyWallet(res.wallet);
          state.inv = state.inv.filter(function (x) { return x.id !== it.id; });
          toast("+" + coin(res.gained) + " ✅");
          renderTop();
          if (after) after();
          render();
        }).catch(function (e) { toast(e.message); });
      });
    }

    function sellAll() {
      if (!state.inv.length) return;
      confirmThen("Barcha buyumlar (" + state.inv.length + " ta) sotilsinmi?", function () {
        request("/api/sell", { all: true }).then(function (res) {
          haptic("success");
          applyWallet(res.wallet);
          state.inv = [];
          toast("+" + coin(res.gained) + " ✅");
          renderTop();
          render();
        }).catch(function (e) { toast(e.message); });
      });
    }

    /* ---------- quti sheet ---------- */
    function closeSheet() {
      sheetRoot.textContent = "";
      document.body.style.overflow = "";
    }

    function spin(c, winner, host) {
      return new Promise(function (resolve) {
        host.textContent = "";
        host.classList.add("show");
        var pool = c.items.length ? c.items : [winner];
        var N = 42, W = 36, CARD = 92, GAP = 8, STEP = CARD + GAP;
        var track = h("div", { class: "track" });
        for (var i = 0; i < N; i++) {
          var it = (i === W) ? winner : pool[Math.floor(Math.random() * pool.length)];
          track.appendChild(h("div", { class: "mini", style: "--c:" + rar(it.rarity).color },
            media(it.image_url, "🎁", "", true),
            h("div", { class: "gname" }, it.name)));
        }
        host.appendChild(track);
        host.appendChild(h("div", { class: "marker" }));
        var offset = W * STEP + CARD / 2 - host.clientWidth / 2 + (Math.random() * 30 - 15);
        var finished = false;
        function finish() { if (!finished) { finished = true; resolve(); } }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            track.style.transition = "transform 4.6s cubic-bezier(.12,.7,.08,1)";
            track.style.transform = "translateX(" + (-offset) + "px)";
          });
        });
        track.addEventListener("transitionend", finish);
        setTimeout(finish, 5300);
      });
    }

    function openSheet(c) {
      closeSheet();
      var busy = false;
      var btn = h("button", { class: "btn primary big" });
      var hint = h("p", { class: "note", style: "display:none" });
      var roulette = h("div", { class: "roulette" });
      var result = h("div", { class: "result" });

      function paintBtn() {
        var me = state.me;
        var label, disabled = false, hintText = "";
        if (!inTG) { label = "Telegram ichida oching"; disabled = true; }
        else if (!me || me.gate !== "ok") { label = "Avval ro‘yxatdan o‘ting"; disabled = true; }
        else if (!c.items.length) { label = "Sovg‘a qo‘shilmagan"; disabled = true; }
        else if (c.price > 0 && me.free_left <= 0 && me.coins < c.price) {
          label = "🪙 " + coin(c.price) + " bilan ochish";
          disabled = true;
          hintText = "Coin yetarli emas. «Buyumlar» bo‘limida sovg‘alarni soting.";
        }
        else if (me.free_left > 0) label = "🎟 Bepul ochish (qoldi: " + me.free_left + ")";
        else label = c.price > 0 ? "🪙 " + coin(c.price) + " bilan ochish" : "🎁 Ochish";
        btn.textContent = busy ? "Ochilmoqda..." : label;
        btn.disabled = disabled || busy;
        hint.textContent = hintText;
        hint.style.display = hintText ? "" : "none";
      }

      function showResult(res) {
        var r = rar(res.item.rarity);
        roulette.classList.remove("show");
        result.textContent = "";
        result.style.setProperty("--c", r.color);
        result.appendChild(media(res.item.image_url, "🎁", "", true));
        result.appendChild(h("div", { class: "rar" }, r.label));
        result.appendChild(h("div", { class: "rname" }, res.item.name));
        result.appendChild(h("div", { class: "pill" }, coin(res.item.price)));
        result.appendChild(h("div", { class: "btnrow" },
          h("button", { class: "btn", onclick: function () { result.classList.remove("show"); } }, "🎒 Qolsin"),
          h("button", { class: "btn primary", onclick: function () {
            sellOne(res.item, function () { result.classList.remove("show"); paintBtn(); });
          } }, "💰 Sotish")
        ));
        result.classList.add("show");
      }

      btn.addEventListener("click", function () {
        if (busy) return;
        busy = true;
        paintBtn();
        result.classList.remove("show");
        haptic();
        request("/api/open", { case_id: c.id }).then(function (res) {
          applyWallet(res.wallet);
          state.inv.unshift(res.item);
          state.invLoaded = true;
          renderTop();
          return spin(c, res.item, roulette).then(function () { return res; });
        }).then(function (res) {
          haptic("success");
          showResult(res);
        }).catch(function (e) {
          roulette.classList.remove("show");
          toast(e.message || "Xatolik");
        }).then(function () {
          busy = false;
          paintBtn();
        });
      });

      paintBtn();
      var sheet = h("div", { class: "sheet", onclick: function (e) { e.stopPropagation(); } },
        h("div", { class: "grab" }),
        h("button", { class: "x", "aria-label": "Yopish", onclick: closeSheet }, "✕"),
        media(c.image_url, "🎁", "hero-media"),
        h("h2", { class: "sheet-title" }, c.name),
        c.description ? h("p", { class: "muted" }, c.description) : null,
        h("div", { class: "row between" },
          h("span", { class: "pill" }, "Narxi: " + coin(c.price)),
          h("span", { class: "muted" }, c.items.length + " ta sovg‘a")),
        roulette,
        result,
        btn,
        hint,
        h("h3", { class: "sec" }, "Qutidagi sovg‘alar"),
        c.items.length
          ? h("div", { class: "grid3" }, c.items.map(function (i) { return giftCard(i, { percent: true }); }))
          : h("p", { class: "muted" }, "Bu qutiga hali sovg‘a qo‘shilmagan.")
      );
      sheetRoot.appendChild(h("div", { class: "overlay", onclick: closeSheet }, sheet));
      document.body.style.overflow = "hidden";
    }

    /* ---------- navigatsiya va yuklash ---------- */
    function visibleTabs() {
      var list = TABS.slice();
      if (state.me && state.me.is_admin) list.push({ id: "admin", label: "Admin", icon: "shield" });
      return list;
    }

    function buildTabs() {
      var list = visibleTabs();
      tabbar.textContent = "";
      tabbar.style.gridTemplateColumns = "repeat(" + list.length + ", 1fr)";
      list.forEach(function (t) {
        var b = h("button", { class: "tab", "data-tab": t.id, onclick: function () { go(t.id); } });
        b.innerHTML = ICONS[t.icon];
        b.appendChild(h("span", null, t.label));
        tabbar.appendChild(b);
      });
    }

    function go(tab) {
      if (tab !== state.tab) haptic();
      state.tab = tab;
      closeSheet();
      if (tab === "inv" && inTG && !state.invLoaded) loadInv();
      if (tab === "admin") loadAdmin();
      if (tab === "wheel") loadWheel();
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      Array.prototype.forEach.call(tabbar.children, function (b) {
        b.classList.toggle("active", b.getAttribute("data-tab") === state.tab);
      });
      renderTop();
      view.textContent = "";
      try {
        if (inTG && state.me && state.me.gate && state.me.gate !== "ok") {
          view.appendChild(gateCard(state.me));
        } else if (state.tab === "case") view.appendChild(viewCases());
        else if (state.tab === "inv") view.appendChild(viewInv());
        else if (state.tab === "friends") view.appendChild(viewFriends());
        else if (state.tab === "admin") view.appendChild(viewAdmin());
        else if (state.tab === "wheel") view.appendChild(viewWheel());
        else view.appendChild(viewHome());
      } catch (e) {
        view.appendChild(h("div", { class: "card empty" }, h("p", null, "Xatolik: " + e.message)));
      }
    }

    function refreshMe() {
      if (!inTG) return;
      request("/api/me", {}).then(function (me) {
        state.me = me;
        buildTabs();
        if (me.gate === "ok" && !state.invLoaded) loadInv();
        render();
      }).catch(function (e) { toast(e.message); });
    }

    function loadInv() {
      if (!inTG) return;
      request("/api/inventory", {}).then(function (d) {
        state.inv = d.items || [];
        applyWallet(d.wallet);
        state.invLoaded = true;
        render();
      }).catch(function (e) {
        state.invLoaded = true;
        toast(e.message);
        render();
      });
    }

    function load() {
      state.loaded = false;
      state.error = "";
      render();
      request("/api/cases")
        .then(function (d) {
          state.cases = d.cases || [];
          state.banner = d.banner || null;
          state.freeLimit = d.free_limit || state.freeLimit;
          state.hero = d.hero || null;
        })
        .catch(function () { state.error = "Qutilarni yuklab bo‘lmadi. Internetni tekshiring."; })
        .then(function () { state.loaded = true; render(); });
      if (inTG) refreshMe();
    }

    window.addEventListener("error", function (e) {
      if (!view.firstChild) view.appendChild(h("div", { class: "card empty" }, h("p", null, "Xatolik: " + e.message)));
    });

    buildTabs();
    load();
  })();
  </script>
</body>
</html>
