<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101722">
  <title>BULLDROP — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101722;
      --card: #1b2735;
      --card2: #223247;
      --line: #334256;
      --text: #f4f6fa;
      --muted: #a9b5c5;
      --pink: #ff4d9e;
      --purple: #9b68ff;
      --gold: #e4b85c;
      --r-common: #8794a8;
      --r-rare: #4da3ff;
      --r-epic: #9b68ff;
      --r-legendary: #e4b85c;
      --r-mythic: #ff4d9e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 14px 14px calc(124px + env(safe-area-inset-bottom));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }

    .muted { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .note { color: var(--muted); font-size: 12px; text-align: center; margin: 12px 0 4px; line-height: 1.4; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { justify-content: space-between; }
    .page-title { font-size: 22px; font-weight: 800; margin: 4px 2px 14px; }
    .sec { font-size: 16px; font-weight: 700; margin: 20px 2px 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }

    /* ---------- ust qism: balans chiplari ---------- */
    .chips { display: flex; gap: 8px; justify-content: flex-end; margin: 0 2px 12px; flex-wrap: wrap; }
    .chip {
      display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, .06); border: 1px solid var(--line); font-size: 13px; color: var(--muted);
    }
    .chip b { color: var(--text); }
    .chip.gold { border-color: rgba(228, 184, 92, .4); color: var(--gold); }
    .chip.gold b { color: var(--gold); }

    /* ---------- Home ---------- */
    .profile { display: flex; align-items: center; gap: 12px; margin: 2px 2px 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line); flex: none; }
    .avatar .emoji { font-size: 20px; font-weight: 700; }
    .hello { font-size: 13px; color: var(--muted); }
    .uname { font-size: 18px; font-weight: 800; }
    .hero {
      border-radius: 22px; padding: 20px 18px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      box-shadow: 0 10px 30px rgba(155, 104, 255, .28);
    }
    .hero h2 { font-size: 24px; font-weight: 900; letter-spacing: .5px; }
    .hero p { margin: 6px 0 16px; font-size: 14px; line-height: 1.4; opacity: .95; }
    .hero { position: relative; overflow: hidden; }
    .hero.has-img { min-height: 210px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg .media { width: 100%; height: 100%; border-radius: 0; }
    .hero-bg img, .hero-bg video { width: 100%; height: 100%; object-fit: cover; }
    .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 14, 22, .10), rgba(10, 14, 22, .78)); }
    .hero-content { position: relative; }
    .wheelcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; margin-top: 12px; }
    .wic { font-size: 30px; }
    /* ---- umumiy o‘yinlar ---- */
    .ggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .gcard { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px; text-align: left; }
    .gcard .gi { font-size: 30px; margin-bottom: 4px; }
    .gcard small { color: var(--muted); }
    .mbet.mbet3 { grid-template-columns: 1fr 52px 52px 60px; }
    /* ---- Minora ---- */
    .tgrid { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .trow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tcell { height: 58px; border-radius: 18px; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: #2a2c31; border: 2px solid transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); transition: transform .1s, background .15s; }
    .tcell.cur { background: #353840; border-color: rgba(255, 255, 255, .75); box-shadow: 0 0 16px rgba(255, 255, 255, .18); }
    .tcell.cur:active { transform: scale(.97); }
    .tcell.ok { background: linear-gradient(180deg, rgba(53, 224, 138, .35), rgba(18, 137, 74, .55)); border-color: rgba(53, 224, 138, .7); }
    .tcell.dim { opacity: .35; }
    .tcell.bad { background: linear-gradient(180deg, rgba(255, 90, 100, .35), rgba(200, 25, 45, .7)); border-color: rgba(255, 90, 100, .8); box-shadow: 0 0 20px rgba(255, 40, 60, .5); }
    .tcell.gbad { background: rgba(200, 25, 45, .3); opacity: .85; }
    .tcell.gok { background: rgba(60, 140, 255, .22); opacity: .85; }
    .tcell .big { font-size: 26px; }
    .tcell.flip { animation: mflip .38s cubic-bezier(.2, .9, .3, 1.2); }
    .tcell { position: relative; overflow: hidden; background: linear-gradient(160deg, rgba(120, 150, 220, .25), rgba(26, 31, 46, .92)); border-color: rgba(170, 195, 255, .16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -10px 16px rgba(0, 0, 0, .3), 0 4px 10px rgba(0, 0, 0, .35); }
    .tcell::before { content: ""; position: absolute; left: 6%; right: 6%; top: 4%; height: 40%; border-radius: 14px 14px 50% 50%; background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0)); pointer-events: none; }
    .tcell.cur { background: linear-gradient(160deg, rgba(150, 180, 255, .4), rgba(40, 48, 70, .95)); border-color: rgba(190, 210, 255, .85); box-shadow: 0 0 18px rgba(130, 170, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .4); }
    .tcell.ok { background: linear-gradient(160deg, rgba(110, 255, 180, .55), rgba(18, 137, 74, .75)); box-shadow: 0 0 18px rgba(53, 224, 138, .35), inset 0 1px 0 rgba(255, 255, 255, .45); }
    .tcell.bad { background: linear-gradient(160deg, rgba(255, 130, 140, .6), rgba(200, 25, 45, .85)); }
    .tcell.flip.ok { animation: mgem .5s cubic-bezier(.2, .9, .3, 1.3); }
    .tcell.flip.ok::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid rgba(160, 255, 200, .9); animation: mring .6s ease-out forwards; pointer-events: none; }
    .tcell.flip.bad { animation: mboom .6s cubic-bezier(.3, .8, .4, 1); }
    .tcell.flip.gbad, .tcell.flip.gok { animation: mghost .35s ease-out; }
    /* ---- Narvon ---- */
    .lboard { background: #171a21; border: 1px solid var(--line); border-radius: 24px; padding: 14px 10px 10px; margin-top: 14px; }
    .lrow { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 28px; }
    .lc { position: relative; }
    .lrow.next .lc { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .lrow.next .lc.sel .lp { background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .8); }
    .lc .mk.pickmk { color: #fff; font-size: 10px; line-height: 15px; bottom: 12px; animation: mflip .25s ease; }
    .lc .lp { position: absolute; left: 0; right: 0; bottom: 2px; height: 9px; border-radius: 6px; background: #272a32; }
    .lrow.done .lp { background: #444853; }
    .lrow.next .lp { background: #ff4d58; box-shadow: 0 0 8px rgba(255, 77, 88, .55); }
    .lc .mk { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); width: 15px; height: 15px; line-height: 15px; font-size: 13px; text-align: center; z-index: 1; }
    .lc .mk svg { width: 100%; height: 100%; display: block; }
    .lc .mk.flip { animation: mpin .5s cubic-bezier(.2, .9, .3, 1.35); }
    @keyframes mpin { 0% { transform: translateX(-50%) translateY(-14px) scale(.3); opacity: 0; } 60% { transform: translateX(-50%) translateY(2px) scale(1.3); opacity: 1; } 100% { transform: translateX(-50%); } }
    .trail { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .55); vertical-align: middle; }
    .lchips { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
    .lchips::-webkit-scrollbar { display: none; }
    .lchip2 { flex: none; padding: 10px 18px; border-radius: 14px; font-weight: 800; background: #25282f; }
    .lchip2.next { background: #2fc96f; color: #fff; }
    .lchip2.done { background: rgba(47, 201, 111, .2); color: #6fe4a2; }
    .lsetup { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-top: 12px; align-items: start; }
    .lsetup .mbet.mbet3 { grid-template-columns: 1fr 1fr 1fr; }
    .lsetup .mbet3 input { grid-column: 1 / -1; }
    .lmodes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lmode { height: 46px; border-radius: 14px; font-size: 18px; font-weight: 900; color: #fff; background: #2a2c31; }
    .lmode.sel { background: #e9ecf2; color: #111; }
    .lmode:disabled { opacity: .55; }
    /* ---- Saper ---- */
    .mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
    .mcell { aspect-ratio: 1 / 1; border-radius: 18px; padding: 10%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(155deg, rgba(120, 150, 220, .28), rgba(40, 48, 70, .55) 46%, rgba(14, 18, 28, .85)); border: 1px solid rgba(170, 195, 255, .22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -12px 18px rgba(0, 0, 0, .32), 0 6px 14px rgba(0, 0, 0, .4);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .12s, box-shadow .2s; }
    .mcell::before { content: ""; position: absolute; left: 10%; right: 10%; top: 5%; height: 36%; border-radius: 14px 14px 60% 60%; background: linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0)); pointer-events: none; }
    .mcell:active:not(:disabled) { transform: scale(.93); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 0 18px rgba(130, 170, 255, .45); }
    .mcell svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); position: relative; }
    .mcell.gem { background: linear-gradient(155deg, rgba(255, 220, 120, .55), rgba(255, 150, 30, .7)); border-color: rgba(255, 215, 120, .8); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 0 20px rgba(255, 180, 50, .4); }
    .mcell.boom { background: linear-gradient(155deg, rgba(255, 120, 130, .6), rgba(210, 25, 45, .85)); border-color: rgba(255, 120, 130, .85); box-shadow: 0 0 26px rgba(255, 40, 60, .65); }
    .mcell.ghostgem { background: linear-gradient(155deg, rgba(255, 220, 120, .18), rgba(255, 150, 30, .3)); opacity: .6; }
    .mcell.ghostmine { background: linear-gradient(155deg, rgba(255, 120, 130, .2), rgba(210, 25, 45, .38)); opacity: .68; }
    .mcell.flip { animation: mflip .4s cubic-bezier(.2, .9, .3, 1.25); }
    .mcell.flip.gem { animation: mgem .5s cubic-bezier(.2, .9, .3, 1.3); }
    .mcell.flip.gem::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid rgba(255, 230, 150, .9); animation: mring .6s ease-out forwards; pointer-events: none; }
    .mcell.flip.boom { animation: mboom .6s cubic-bezier(.3, .8, .4, 1); }
    .mcell.flip.boom::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(255, 90, 90, .5) 45%, transparent 70%); animation: mflash .5s ease-out forwards; pointer-events: none; }
    .mcell.flip.ghostgem, .mcell.flip.ghostmine { animation: mghost .35s ease-out; }
    @keyframes mgem { 0% { transform: scale(.5) rotateY(180deg); opacity: 0; } 55% { transform: scale(1.14) rotateY(0); opacity: 1; } 100% { transform: none; } }
    @keyframes mring { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.45); opacity: 0; } }
    @keyframes mboom { 0% { transform: scale(.6); } 25% { transform: scale(1.18) translateX(-4px); } 40% { transform: translateX(5px) rotate(2deg); } 55% { transform: translateX(-4px) rotate(-2deg); } 70% { transform: translateX(3px); } 100% { transform: none; } }
    @keyframes mflash { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.6); } }
    @keyframes mghost { from { transform: scale(.8); opacity: 0; } to { transform: none; } }
    .mrand { margin-top: 10px; }
    .mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .minfo { padding: 14px; }
    .minfo .iv { font-size: 20px; font-weight: 900; }
    .minfo .il { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .mmode { display: flex; align-items: center; justify-content: space-between; padding: 8px; }
    .mmode .mv { text-align: center; }
    .mmode .mvn { font-size: 24px; font-weight: 900; }
    .mmode small { color: var(--muted); font-size: 12px; }
    .marrow { width: 36px; height: 44px; font-size: 26px; font-weight: 900; color: #fff; border-radius: 12px; background: rgba(255, 255, 255, .07); }
    .marrow:disabled { opacity: .3; }
    .mbet { display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; margin-top: 10px; align-items: center; }
    .mbet .btn { margin-top: 0; height: 100%; }
    .mnext { text-align: center; font-weight: 800; color: var(--gold); min-height: 22px; margin-top: 10px; }
    .mladder { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .mladder::-webkit-scrollbar { display: none; }
    .lchip { flex: none; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 13px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); text-align: center; }
    .lchip small { display: block; font-size: 10px; color: var(--muted); }
    .lchip.cur { background: rgba(255, 170, 40, .25); border-color: rgba(255, 190, 80, .8); }
    .lchip.done { opacity: .5; }
    /* ---- G‘ildirak ---- */
    .whead { display: flex; align-items: center; justify-content: space-between; }
    .wleft { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .gback { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .gback .ic { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.4; filter: none; }
    .gtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
    .gtile { display: flex; flex-direction: column; gap: 8px; text-align: left; background: none; padding: 0; transition: transform .15s; }
    .gtile:active { transform: scale(.96); }
    .gtile .gimg { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 26px; border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 10px 24px rgba(0, 0, 0, .35); background: #1b1d20; }
    .gtile b { font-size: 16px; padding: 0 4px; }
    .gtile small { color: var(--muted); padding: 0 4px; margin-top: -6px; }
    .whead .wt { margin: 0; }
    .wsnd { width: 40px; height: 40px; border-radius: 14px; font-size: 18px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .wstage { position: relative; height: 440px; margin: 12px -16px 0; overflow: hidden; border-radius: 26px; contain: paint; isolation: isolate;
      background: radial-gradient(90% 46% at 50% 34%, #232830, transparent 78%), repeating-linear-gradient(90deg, rgba(255, 255, 255, .022) 0 2px, transparent 2px 10px), linear-gradient(180deg, #15181e, #08090c);
      border: 1px solid rgba(255, 255, 255, .07); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
    .wbody { position: absolute; left: 50%; width: 1400px; height: 1400px; margin-left: -700px; top: -1139px; border-radius: 50%; z-index: 0; pointer-events: none;
      background: radial-gradient(circle closest-side, #04060a 0, #080a0e 95.2%, #b4bbc7 95.7%, #7a8290 96.5%, #3a404b 97.8%, #1d2128 99%, #0a0c10 99.6%, transparent 100%); }
    .whoses { position: absolute; left: 0; top: 246px; width: 100%; height: 194px; z-index: 0; pointer-events: none; }
    .wring { position: absolute; inset: 0; z-index: 1; }
    .wtile { position: absolute; left: 0; top: 0; width: 92px; height: 88px; margin: -44px 0 0 -46px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255, 255, 255, .14); will-change: transform; backface-visibility: hidden; visibility: hidden;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .38), inset 0 -12px 20px rgba(0, 0, 0, .28), 0 10px 16px rgba(0, 0, 0, .5); }
    .wtile::before { content: ""; position: absolute; left: 7%; right: 7%; top: 4%; height: 36%; border-radius: 13px 13px 40px 40px; background: linear-gradient(180deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0)); pointer-events: none; }
    .wtile .wti { display: flex; position: relative; }
    .wtile .wti svg { width: 58px; height: 58px; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .5)); }
    .k-x1 { background: linear-gradient(160deg, #4d97f5, #2154b8); }
    .k-x2 { background: linear-gradient(160deg, #35c97c, #0f7a45); }
    .k-x5 { background: linear-gradient(160deg, #f4566c, #a0132b); }
    .k-x10 { background: linear-gradient(160deg, #b878ff, #5d25c4); }
    .wtile.locked { filter: grayscale(1) brightness(.45); }
    .wtile.hit { border-color: #fff; box-shadow: 0 0 0 2px #fff, 0 0 28px 6px rgba(255, 255, 255, .5), inset 0 2px 0 rgba(255, 255, 255, .5); z-index: 2; }
    .wshade { position: absolute; inset: 0; pointer-events: none; z-index: 2; background: linear-gradient(90deg, rgba(8, 10, 14, .85), transparent 17%, transparent 83%, rgba(8, 10, 14, .85)); }
    .wdhouse { position: absolute; top: 8px; left: 50%; width: 244px; height: 92px; transform: translateX(-50%); z-index: 3; border-radius: 22px 22px 34px 34px;
      background: linear-gradient(180deg, #6a717d, #353b45 38%, #1a1d23); border: 1px solid #7d8591; box-shadow: 0 12px 24px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -10px 16px rgba(0, 0, 0, .5); }
    .wdhouse::before, .wdhouse::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #cfd5df, #4a515d); box-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
    .wdhouse::before { left: 7px; } .wdhouse::after { right: 7px; }
    .wdisp { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 204px; height: 56px; z-index: 4; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #0c0f13, #030405); border: 1px solid #2d333c; box-shadow: inset 0 3px 10px rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 255, 255, .12); }
    .wdisp::after { content: ""; position: absolute; inset: 0; border-radius: 12px; background-image: radial-gradient(rgba(0, 0, 0, .72) 38%, transparent 44%); background-size: 4px 4px; pointer-events: none; }
    .wdisp .db { font: 900 36px/1 monospace; letter-spacing: 5px; color: #f4f7ff; text-shadow: 0 0 10px rgba(160, 195, 255, .95); font-variant-numeric: tabular-nums; }
    .wdisp.spin .db { color: #ffd966; text-shadow: 0 0 12px rgba(255, 200, 80, .95); }
    .wpointer { position: absolute; top: 90px; left: 50%; width: 40px; height: 48px; transform: translateX(-50%); transform-origin: 50% 6%; z-index: 5; background: linear-gradient(180deg, #f3f5f9, #a2abba 62%, #6b7483); clip-path: polygon(50% 100%, 0 24%, 14% 0, 86% 0, 100% 24%); filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .7)); }
    .wped { position: absolute; left: 50%; bottom: -8px; width: 170px; height: 56px; margin-left: -85px; z-index: 1; border-radius: 40px 40px 0 0; background: linear-gradient(180deg, #2c313a, #101216); border: 1px solid #3a404a; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .1); }
    .whist { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, #000 75%, transparent); mask-image: linear-gradient(90deg, #000 75%, transparent); }
    .hd { width: 30px; height: 30px; border-radius: 10px; flex: none; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .4), 0 2px 4px rgba(0, 0, 0, .4); }
    .wchips { display: flex; justify-content: center; gap: 10px; margin: 12px 0; }
    .wchip { padding: 9px 16px; border-radius: 14px; font-weight: 800; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .wbanner { text-align: center; font-weight: 900; font-size: 18px; padding: 0; max-height: 0; overflow: hidden; border-radius: 16px; transition: max-height .25s, padding .25s; }
    .wbanner.show { max-height: 70px; padding: 12px; margin-bottom: 12px; }

    /* ---------- tugmalar ---------- */
    .btn {
      position: relative; border-radius: 16px; padding: 12px 16px; font-weight: 800; color: #fff;
      background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05));
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -8px 14px rgba(255, 255, 255, .03), 0 6px 18px rgba(0, 0, 0, .28);
      -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn::after { content: ""; position: absolute; left: 12%; right: 12%; top: 2px; height: 42%; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent); pointer-events: none; }
    .btn.primary {
      background: linear-gradient(135deg, rgba(255, 79, 163, .78), rgba(143, 90, 255, .78));
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 24px rgba(214, 80, 220, .35);
    }
    .btn.white {
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .78)); color: #1b1030;
      border: 1px solid rgba(255, 255, 255, .8);
      box-shadow: inset 0 1px 0 #fff, 0 8px 22px rgba(0, 0, 0, .25);
    }
    .btn.white::after { display: none; }
    .btn:disabled { opacity: .5; }
    .btn.big { width: 100%; padding: 15px; font-size: 16px; }
    .btn.small { padding: 9px 10px; font-size: 13px; border-radius: 13px; width: 100%; margin-top: 8px; }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    /* ---------- media ---------- */
    .media { display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .media img, .media video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .media .emoji { font-size: 36px; line-height: 1; }
    .lottie { width: 100%; height: 100%; }
    .lottie svg { width: 100% !important; height: 100% !important; }

    /* ---------- kartalar ---------- */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .case {
      padding: 10px; text-align: left; width: 100%;
      background: linear-gradient(165deg, var(--t1, var(--card)), var(--t2, var(--card))); border: 1px solid var(--t3b, var(--line)); border-radius: 18px;
      transition: transform .12s ease, background .4s ease; box-shadow: 0 10px 26px -14px var(--t3, transparent);
    }
    .case:active { transform: scale(.97); }
    .case .media {
      aspect-ratio: 1 / 1; border-radius: 14px;
      background: radial-gradient(circle at 50% 35%, var(--t3, rgba(155, 104, 255, .35)), transparent 72%), var(--t2, var(--card2));
    }
    .case .media .emoji { font-size: 56px; }
    .mbg { position: absolute; inset: -18%; background-size: cover; background-position: center; filter: blur(20px) saturate(1.6) brightness(.78); pointer-events: none; }
    .media .mbg ~ img, .media .mbg ~ video { position: relative; z-index: 1; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .35)); }
    .case { position: relative; overflow: hidden; }
    .case::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; background: linear-gradient(180deg, rgba(255, 255, 255, .1), transparent); pointer-events: none; border-radius: 18px 18px 0 0; }
    .case .media { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 18px -8px rgba(0, 0, 0, .6); }
    .case .name { font-weight: 800; font-size: 15px; margin: 10px 2px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .case .sub { color: var(--muted); font-size: 12px; margin: 0 2px 8px; }
    .pill {
      display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800;
      background: rgba(228, 184, 92, .14); color: var(--gold); border: 1px solid rgba(228, 184, 92, .35);
    }
    .gift {
      --c: var(--r-common);
      position: relative; overflow: hidden; min-width: 0; text-align: left;
      padding: 14px 10px 10px; border-radius: 16px;

        radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--c) 46%, transparent), transparent 75%),
        linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, #0e121a), color-mix(in srgb, var(--c) 8%, #0e121a));
      border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
    }
    .gift::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);

      box-shadow: 0 2px 14px var(--c);
    }

    .gift .gcat { font-size: 11px; font-weight: 600; margin-top: 6px; color: color-mix(in srgb, var(--c) 55%, #aab3c2); }
    .gift .gname { font-size: 13px; font-weight: 800; margin-top: 1px; line-height: 1.25; max-height: 33px; overflow: hidden; }

    .gift .gprice { font-size: 12px; font-weight: 800; color: var(--gold); }
    .gift .gpct { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: rgba(0, 0, 0, .35); color: #fff; }
    .gift .btn { width: 100%; margin-top: 8px; }

    .skeleton { height: 200px; border-radius: 18px; background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%); background-size: 200% 100%; animation: shine 1.2s infinite linear; }

    /* ---------- shaffof pastki menyu (NFT bot uslubi) ---------- */
    .tabbar {
      position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20;
      display: grid; gap: 6px; padding: 8px; border-radius: 36px;
      background: rgba(34, 35, 38, .95);
      backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .5);
    }
    .tab {
      --cut: #222326;
      background: none; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 68px; padding: 8px 0 7px; font-size: 11.5px; font-weight: 700; color: #8e9096; transition: background .2s, color .2s;
      -webkit-tap-highlight-color: transparent;

    .tab svg { width: 30px; height: 30px; fill: currentColor; stroke: none; }
    .tab svg .cut { fill: none; stroke: var(--cut); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .tab svg .ln { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { --cut: #131416; background: #131416; color: #2f8cff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07), 0 3px 12px rgba(0, 0, 0, .55); }
    /* o'yinlar oynasi (popup) */
    .gpop-bg { position: fixed; inset: 0; z-index: 18; }
    .gpop { position: fixed; left: 50%; z-index: 19; width: min(calc(100% - 28px), 440px); padding: 18px 12px 10px; border-radius: 30px; background: #1d1e21; border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 18px 44px rgba(0, 0, 0, .6); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; animation: gpop .18s ease-out; transform: translateX(-50%); }
    @keyframes gpop { from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(.96); } to { opacity: 1; transform: translateX(-50%); } }
    .gpop button { background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0 8px; font-weight: 700; font-size: 14px; color: #fff; }
    .gpop button:active { transform: scale(.94); }
    .gpop img { width: 76px; height: 76px; border-radius: 22px; object-fit: cover; background: #111; box-shadow: 0 4px 12px rgba(0, 0, 0, .45); }
    /* quti: bir necha marta ochish */
    .cnts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px; margin: 10px 0 4px; border-radius: 22px; background: #15171b; border: 1px solid var(--line); }
    .cnt { padding: 14px 0; border-radius: 16px; font-weight: 800; font-size: 18px; color: #8e9096; background: none; }
    .cnt.sel { background: #272b33; color: #fff; }
    .cnt:disabled { opacity: .55; }
    .roulette.multi { height: auto; padding: 10px; }
    .roulette.multi.show { display: grid; gap: 8px; }
    .mrow { display: grid; gap: 6px; justify-content: center; }
    .reel { position: relative; overflow: hidden; border-radius: 14px; background: #12151b; border: 1px solid var(--line); }
    .reel::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--pink); box-shadow: 0 0 10px var(--pink); pointer-events: none; }
    .rtrack { will-change: transform; }
    .rcell { --c: var(--r-common); box-sizing: border-box; display: grid; place-items: center; padding: 6px; background: radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--c) 40%, transparent), transparent 75%); }
    .rcell .media { width: 100%; height: 100%; }
    .rcell .media .emoji { font-size: 26px; }

    .rcard { --c: var(--r-common); padding: 8px 4px; border-radius: 12px; text-align: center; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); background: color-mix(in srgb, var(--c) 12%, #0e121a); }
    .result .rcard .media { width: 100%; height: 54px; margin: 0; }
    .result .rcard .media .emoji { font-size: 28px; }
    .rcard .gname { font-size: 11px; font-weight: 700; margin-top: 4px; line-height: 1.2; max-height: 26px; overflow: hidden; }
    .rcard .pr { font-size: 12px; font-weight: 800; margin-top: 2px; opacity: .85; }

    /* ---------- bottom sheet ---------- */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .62); display: flex; align-items: flex-end; animation: fade .2s ease; }
    .sheet {
      position: relative; width: 100%; max-height: 92vh; overflow-y: auto;
      background: var(--bg); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
      padding: 14px 14px calc(22px + env(safe-area-inset-bottom)); animation: up .26s ease;
    }
    .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
    .x { position: absolute; top: 12px; right: 12px; z-index: 5; width: 34px; height: 34px; border-radius: 50%; background: var(--card2); font-size: 15px; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
    .hero-media { height: 170px; border-radius: 18px; background: radial-gradient(circle at 50% 40%, var(--t3, rgba(155, 104, 255, .4)), transparent 72%), linear-gradient(165deg, var(--t1, var(--card2)), var(--t2, var(--card2))); }
    .hero-media .emoji { font-size: 76px; }
    .sheet-title { font-size: 22px; font-weight: 900; margin: 14px 2px 4px; }
    .sheet .row { margin: 10px 2px 12px; }

    .track { display: flex; gap: 8px; padding: 10px 0; will-change: transform; }

    .mini::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 34%; height: 4px; border-radius: 0 0 6px 6px; background: var(--c); }

    .mini .media .emoji { font-size: 30px; }

    .marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--pink); box-shadow: 0 0 14px var(--pink); pointer-events: none; }
    .result { display: none; margin-bottom: 12px; padding: 18px; text-align: center; border-radius: 18px; background: var(--card); border: 1px solid var(--c, var(--line)); animation: pop .35s ease; }

    .gatebox { text-align: center; padding: 26px 18px; }
    .gatebox .big { font-size: 46px; }
    .gatebox h2 { font-size: 18px; margin: 10px 0 6px; }

    #toast { position: fixed; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 80; max-width: 86%; padding: 11px 16px; border-radius: 12px; background: #000c; border: 1px solid var(--line); font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: .25s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ---------- Qurilish: to'liq ekran ---------- */

    function bdLoop(ts) {

        BD.fc++;

    function spin(c, winner, host) {
      return new Promise(function (resolve) {
        host.textContent = "";
        host.classList.add("show");
        var pool = c.items.length ? c.items : [winner];
        var N = 42, W = 36, CARD = 92, GAP = 8, STEP = CARD + GAP;
        var track = h("div", { class: "track" });
        for (var i = 0; i < N; i++) {
          var it = (i === W) ? winner : pool[Math.floor(Math.random() * pool.length)];
          track.appendChild(h("div", { class: "mini", style: "--c:" + rar(it.rarity).color },
            media(it.image_url, "🎁", "", true),
            h("div", { class: "gname" }, it.name)));
        }
        host.appendChild(track);
        host.appendChild(h("div", { class: "marker" }));
        var offset = W * STEP + CARD / 2 - host.clientWidth / 2 + (Math.random() * 30 - 15);
        var finished = false;
        function finish() { if (!finished) { finished = true; resolve(); } }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            track.style.transition = "transform 4.6s cubic-bezier(.12,.7,.08,1)";
            track.style.transform = "translateX(" + (-offset) + "px)";
          });
        });
        track.addEventListener("transitionend", finish);
        setTimeout(finish, 5300);

          h("button", { class: "btn primary", onclick: function () {
            confirmThen("Barcha " + items.length + " ta sovg‘a " + coin(total) + " ga sotilsinmi?", function () {
              request("/api/sell", { ids: items.map(function (x) { return x.id; }) }).then(function (res) {
                haptic("success");
                applyWallet(res.wallet);
                var gone = {}; items.forEach(function (x) { gone[x.id] = 1; });
                state.inv = state.inv.filter(function (x) { return !gone[x.id]; });
                toast("+" + coin(res.gained) + " ✅");
                renderTop(); result.classList.remove("show"); paintBtn(); render();
              }).catch(function (e) { toast(e.message); });
            });
          } }, "💰 Hammasini sotish")
        ));
        result.classList.add("show");
      }

      function showResult(res) {
        var r = rar(res.item.rarity);
        roulette.classList.remove("show", "multi");
        result.textContent = "";
        result.className = "result";
        result.style.setProperty("--c", r.color);
        result.appendChild(media(res.item.image_url, "🎁", "", true));
        result.appendChild(h("div", { class: "rar" }, r.label));
        result.appendChild(h("div", { class: "rname" }, res.item.name));
        result.appendChild(h("div", { class: "pill" }, coin(res.item.price)));
        result.appendChild(h("div", { class: "btnrow" },
          h("button", { class: "btn", onclick: function () { result.classList.remove("show"); } }, "🎒 Qolsin"),
          h("button", { class: "btn primary", onclick: function () {
            sellOne(res.item, function () { result.classList.remove("show"); paintBtn(); });
          } }, "💰 Sotish")
        ));
        result.classList.add("show");
      }

      btn.addEventListener("click", function () {
        if (busy) return;
        busy = true;
        paintBtn();
        result.classList.remove("show");
        haptic();
        roulette.classList.remove("multi");
        request("/api/open", { case_id: c.id, count: count }).then(function (res) {
          var got = res.items && res.items.length ? res.items : [res.item];
          applyWallet(res.wallet);
          got.slice().reverse().forEach(function (it) { state.inv.unshift(it); });
          state.invLoaded = true;
          renderTop();
          if (got.length === 1) return spin(c, got[0], roulette).then(function () { return res; });
          return spinMulti(got).then(function () { return res; });
        }).then(function (res) {
          haptic("success");
          if (res.items && res.items.length > 1) showResultMulti(res.items); else showResult(res);
        }).catch(function (e) {
          roulette.classList.remove("show", "multi");
          toast(e.message || "Xatolik");
        }).then(function () {
          busy = false;
          paintBtn();
        });
      });

      paintBtn();
      var sheet = h("div", { class: "sheet", onclick: function (e) { e.stopPropagation(); } },
        h("div", { class: "grab" }),
        h("button", { class: "x", "aria-label": "Yopish", onclick: closeSheet }, "✕"),
        (function () { var m = media(c.image_url, "🎁", "hero-media"); caseTheme(m, c, m); return m; })(),
        h("h2", { class: "sheet-title" }, c.name),
        c.description ? h("p", { class: "muted" }, c.description) : null,
        h("div", { class: "row between" },
          h("span", { class: "pill" }, "Narxi: " + coin(c.price)),
          h("span", { class: "muted" }, c.items.length + " ta sovg‘a")),
        roulette,
        result,
        btn,
        cnts,
        hint,
        h("h3", { class: "sec" }, "Qutidagi sovg‘alar"),
        c.items.length
          ? h("div", { class: "grid3" }, c.items.map(function (i) { return giftCard(i, { percent: true }); }))
          : h("p", { class: "muted" }, "Bu qutiga hali sovg‘a qo‘shilmagan.")
      );
      sheetRoot.appendChild(h("div", { class: "overlay", onclick: closeSheet }, sheet));
      document.body.style.overflow = "hidden";
    }

    /* ---------- navigatsiya va yuklash ---------- */
    function visibleTabs() {
      var list = TABS.slice();
      if (state.me && state.me.is_admin) list.push({ id: "admin", label: "Admin", icon: "shield" });
      return list;
    }

    function buildTabs() {
      var list = visibleTabs();
      tabbar.textContent = "";
      tabbar.style.gridTemplateColumns = "repeat(" + list.length + ", 1fr)";
      list.forEach(function (t) {
        var b = h("button", { class: "tab", "data-tab": t.id, onclick: function () { go(t.id); } });
        b.innerHTML = ICONS[t.icon];
        b.appendChild(h("span", null, t.label));
        tabbar.appendChild(b);
      });
    }

    function syncBack() {
      try {
        if (!tg || !tg.BackButton) return;
        if (GAME_TABS.indexOf(state.tab) >= 0) tg.BackButton.show(); else tg.BackButton.hide();
      } catch (e) {}
    }
    try {
      if (tg && tg.BackButton) tg.BackButton.onClick(function () {
        if (GAME_TABS.indexOf(state.tab) >= 0) { document.body.classList.remove("imm"); go(state.lastTab || "home"); }
      });
    } catch (e) {}

    function go(tab) {
      if (tab !== state.tab) haptic();
      if (GAME_TABS.indexOf(tab) < 0) state.lastTab = tab;
      closeGames();
      state.tab = tab;
      syncBack();
      closeSheet();
      if (tab === "inv" && inTG && !state.invLoaded) loadInv();
      if (tab === "admin") loadAdmin();
      if (tab === "wheel") loadWheel();
      if (tab === "mines") loadMines();
      if (tab === "tower") loadTower();
      if (tab === "ladder") loadLadder();
      if (tab === "build") loadBuild();
      if (tab === "signal") loadSignal();
      if (tab === "friends" && inTG) loadBonus();
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      paintTabs();
      renderTop();
      document.body.classList.remove("imm");
      view.textContent = "";
      try {
        if (inTG && state.me && state.me.gate && state.me.gate !== "ok") {
          view.appendChild(gateCard(state.me));
        } else if (state.tab === "case") view.appendChild(viewCases());
        else if (state.tab === "inv") view.appendChild(viewInv());
        else if (state.tab === "friends") view.appendChild(viewFriends());
        else if (state.tab === "admin") view.appendChild(viewAdmin());
        else if (state.tab === "wheel") view.appendChild(viewWheel());
        else if (state.tab === "mines") view.appendChild(viewMines());
        else if (state.tab === "tower") view.appendChild(viewTower());
        else if (state.tab === "ladder") view.appendChild(viewLadder());
        else if (state.tab === "build") view.appendChild(viewBuild());
        else if (state.tab === "signal") view.appendChild(viewSignal());
        else if (state.tab === "paperio") view.appendChild(viewPaperio());
        else if (state.tab === "games") view.appendChild(viewGames());
        else view.appendChild(viewHome());
      } catch (e) {
        view.appendChild(h("div", { class: "card empty" }, h("p", null, "Xatolik: " + e.message)));
      }
    }

    function refreshMe() {
      if (!inTG) return;
      request("/api/me", {}).then(function (me) {
        state.me = me;
        buildTabs();
        if (me.gate === "ok" && !state.invLoaded) loadInv();
        render();
      }).catch(function (e) { toast(e.message); });
    }

    function loadInv() {
      if (!inTG) return;
      request("/api/inventory", {}).then(function (d) {
        state.inv = d.items || [];
        applyWallet(d.wallet);
        state.invLoaded = true;
        render();
      }).catch(function (e) {
        state.invLoaded = true;
        toast(e.message);
        render();
      });
    }

    function load() {
      state.loaded = false;
      state.error = "";
      render();
      request("/api/cases")
        .then(function (d) {
          state.cases = d.cases || [];
          state.banner = d.banner || null;
          state.freeLimit = d.free_limit || state.freeLimit;
          state.hero = d.hero || null;
          state.freeCase = d.free_case || 0;
        })
        .catch(function () { state.error = "Qutilarni yuklab bo‘lmadi. Internetni tekshiring."; })
        .then(function () { state.loaded = true; render(); });
      if (inTG) refreshMe();
    }

    window.addEventListener("error", function (e) {
      if (!view.firstChild) view.appendChild(h("div", { class: "card empty" }, h("p", null, "Xatolik: " + e.message)));
    });

    buildTabs();
    load();
    try {
      var gm = new URLSearchParams(location.search).get("game");
      if (gm === "wheel" || gm === "mines" || gm === "tower" || gm === "ladder" || gm === "build" || gm === "signal" || gm === "paperio" || gm === "games") go(gm);
    } catch (e) {}
  })();
  </script>
</body>
</html>
